<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>2030B – Be Smarter | Dashboard System</title>
  <meta name="description" content="2030B Be Smarter – Cognitive Enhancement Dashboard Platform. 50 interactive slides with RTL/LTR support.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cairo:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* ─── MASTER LAYOUT ─── */
    body {
      overflow: hidden;
      height: 100dvh;
    }

    /* ─── MAIN VIEWER ─── */
    .app-wrapper {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--g-bg);
      position: relative;
      overflow: hidden;
    }

    /* ─── TOP BAR ─── */
    .top-bar {
      height: 56px;
      background: rgba(11,15,26,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 200;
      flex-shrink: 0;
    }

    .top-bar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      font-size: 22px;
      font-weight: 900;
      background: var(--g-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.4);
      font-weight: 500;
    }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── SLIDE CAROUSEL ─── */
    .carousel-wrapper {
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slide-iframe-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .slide-iframe {
      border: none;
      border-radius: 0;
      width: 100%;
      height: 100%;
      background: #0B0F1A;
    }

    @media (min-width: 768px) {
      .slide-iframe {
        aspect-ratio: 9 / 16;
        width: auto;
        height: 100%;
        max-height: 90vh;
        border-radius: 24px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 24px 80px rgba(0,0,0,0.6);
      }
    }

    /* ─── SLIDE COUNTER ─── */
    .slide-counter {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11,15,26,0.85);
      border: 1px solid var(--c-border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: rgba(255,255,255,0.5);
      backdrop-filter: blur(10px);
      z-index: 300;
      pointer-events: none;
    }

    /* ─── NAV ARROWS ─── */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(11,15,26,0.85);
      border: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: rgba(255,255,255,0.6);
      transition: all 0.2s;
      backdrop-filter: blur(10px);
      z-index: 300;
    }

    .nav-arrow:hover {
      background: rgba(99,179,237,0.2);
      border-color: rgba(99,179,237,0.4);
      color: #fff;
      transform: translateY(-50%) scale(1.05);
    }

    .nav-prev { left: 16px; }
    .nav-next { right: 16px; }

    @media (max-width: 767px) {
      .nav-arrow { display: none; }
    }

    /* ─── BOTTOM SLIDE RAIL ─── */
    .slide-rail {
      height: 80px;
      background: rgba(11,15,26,0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--c-border);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .slide-rail::-webkit-scrollbar { display: none; }

    .slide-thumb {
      min-width: 52px;
      height: 56px;
      border-radius: 10px;
      border: 1.5px solid var(--c-border);
      background: rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .slide-thumb:hover {
      background: rgba(99,179,237,0.1);
      border-color: rgba(99,179,237,0.3);
    }

    .slide-thumb.active {
      background: rgba(99,179,237,0.2);
      border-color: var(--c-accent-blue);
    }

    .slide-thumb-num {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.5);
    }

    .slide-thumb.active .slide-thumb-num {
      color: var(--c-accent-blue);
    }

    .slide-thumb-icon {
      font-size: 16px;
    }

    /* ─── PROGRESS BAR (top) ─── */
    .progress-ribbon {
      height: 2px;
      background: var(--c-border);
      flex-shrink: 0;
    }

    .progress-ribbon-fill {
      height: 100%;
      background: var(--g-primary);
      transition: width 0.4s ease;
    }

    /* ─── SIDEBAR (desktop) ─── */
    @media (min-width: 1200px) {
      .carousel-wrapper {
        gap: 20px;
        padding: 20px;
      }
    }

    /* ─── TOUCH SWIPE ─── */
    .carousel-wrapper {
      user-select: none;
      -webkit-user-select: none;
    }

    /* ─── LOADING OVERLAY ─── */
    #app-loading {
      position: fixed;
      inset: 0;
      background: var(--c-bg-deep);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      gap: 24px;
      transition: opacity 0.5s, visibility 0.5s;
    }

    #app-loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loading-brand .logo-text {
      font-size: 52px;
      font-weight: 900;
      background: var(--g-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .loading-brand .tagline {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(99,179,237,0.15);
      border-top-color: var(--c-accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ─── KEYBOARD HINT ─── */
    .keyboard-hint {
      position: fixed;
      bottom: 96px;
      right: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      z-index: 300;
      pointer-events: none;
    }

    @media (max-width: 767px) { .keyboard-hint { display: none; } }
  </style>
</head>
<body>
<canvas id="particles-canvas"></canvas>

<!-- Loading Screen -->
<div id="app-loading">
  <div class="loading-brand">
    <div class="logo-text">2030B</div>
    <div class="tagline">Be Smarter</div>
  </div>
  <div class="loading-spinner"></div>
  <div style="font-size:13px;color:rgba(255,255,255,0.3)">Loading Cognitive Dashboard...</div>
</div>

<!-- App Wrapper -->
<div class="app-wrapper">

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-brand">
      <div class="brand-logo">2030B</div>
      <div class="brand-sub">Be Smarter</div>
    </div>
    <div class="top-bar-controls">
      <!-- Language Toggle -->
      <div class="lang-toggle" id="langToggle">
        <div class="lang-btn active" data-lang="en" onclick="switchLang('en')">EN</div>
        <div class="lang-btn" data-lang="ar" onclick="switchLang('ar')">AR</div>
      </div>
      <!-- Slide Jump (quick input) -->
      <div class="icon-btn" id="goToBtn" onclick="toggleSlideInput()" title="Jump to slide">🎯</div>
    </div>
  </div>

  <!-- Progress Ribbon -->
  <div class="progress-ribbon">
    <div class="progress-ribbon-fill" id="progressRibbon" style="width:2%"></div>
  </div>

  <!-- Slide Carousel -->
  <div class="carousel-wrapper" id="carouselWrapper">
    <div class="slide-counter" id="slideCounter">01 / 50</div>
    <button class="nav-arrow nav-prev" id="prevBtn" onclick="navigate(-1)">‹</button>
    <div class="slide-iframe-container" id="slideContainer">
      <iframe class="slide-iframe" id="slideIframe" src="about:blank" allowfullscreen></iframe>
    </div>
    <button class="nav-arrow nav-next" id="nextBtn" onclick="navigate(1)">›</button>
  </div>

  <!-- Slide Rail (thumbnails) -->
  <div class="slide-rail" id="slideRail"></div>

</div>

<!-- Keyboard Hint -->
<div class="keyboard-hint">← → Arrow Keys | Space</div>

<!-- Quick Jump Input (hidden) -->
<div id="jumpOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center">
  <div style="background:var(--c-bg-mid);border:1px solid var(--c-border);border-radius:16px;padding:24px;min-width:240px;text-align:center">
    <div style="font-size:14px;color:rgba(255,255,255,0.7);margin-bottom:12px">Jump to Slide (1–50)</div>
    <input id="jumpInput" type="number" min="1" max="50"
      style="width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--c-border);border-radius:8px;padding:10px;font-size:20px;font-family:var(--font-mono);color:#fff;text-align:center;outline:none"
      onkeydown="handleJumpKey(event)">
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeJump()">Cancel</button>
      <button class="btn btn-primary" style="flex:1" onclick="doJump()">Go</button>
    </div>
  </div>
</div>

<script src="js/animations.js"></script>
<script src="js/loader.js"></script>
<script src="js/slide-utils.js"></script>
<script>
  // ─── SLIDE METADATA ────────────────────────────────────────────
  const SLIDES = [
    { num:1,  icon:'🏠', title:'Welcome Dashboard' },
    { num:2,  icon:'🧠', title:'Cognitive Enhancement' },
    { num:3,  icon:'🧩', title:'Daily Challenge' },
    { num:4,  icon:'💎', title:'CTC Wallet' },
    { num:5,  icon:'🚀', title:'Projects Discovery' },
    { num:6,  icon:'🏗️', title:'Project Detail' },
    { num:7,  icon:'📋', title:'Active Projects' },
    { num:8,  icon:'💬', title:'Workspace' },
    { num:9,  icon:'✅', title:'Verification' },
    { num:10, icon:'⭐', title:'Reputation' },
    { num:11, icon:'📚', title:'Learning Hub' },
    { num:12, icon:'🏆', title:'Leaderboards' },
    { num:13, icon:'📊', title:'Analytics' },
    { num:14, icon:'🛍️', title:'Marketplace' },
    { num:15, icon:'👥', title:'Team Formation' },
    { num:16, icon:'🔍', title:'Knowledge Base' },
    { num:17, icon:'⚙️', title:'Resources' },
    { num:18, icon:'🎓', title:'Mentorship' },
    { num:19, icon:'💡', title:'Innovation' },
    { num:20, icon:'🌍', title:'Social Impact' },
    { num:21, icon:'📅', title:'Events' },
    { num:22, icon:'🗣️', title:'Community' },
    { num:23, icon:'🔧', title:'Settings' },
    { num:24, icon:'❓', title:'Help Center' },
    { num:25, icon:'🔔', title:'Notifications' },
    { num:26, icon:'🏅', title:'Achievements' },
    { num:27, icon:'📄', title:'Templates' },
    { num:28, icon:'💚', title:'Cognitive Health' },
    { num:29, icon:'🔗', title:'Synergy Finder' },
    { num:30, icon:'🔎', title:'Advanced Search' },
    { num:31, icon:'🔒', title:'CTC Staking' },
    { num:32, icon:'🗺️', title:'Skill Roadmap' },
    { num:33, icon:'📈', title:'Performance' },
    { num:34, icon:'🚨', title:'Global Challenges' },
    { num:35, icon:'⚡', title:'Neural Link' },
    { num:36, icon:'📦', title:'Resource Exchange' },
    { num:37, icon:'🔮', title:'Predictive Engine' },
    { num:38, icon:'🧿', title:'Consciousness' },
    { num:39, icon:'🌐', title:'Multi-Reality' },
    { num:40, icon:'✨', title:'Legacy Tracker' },
    { num:41, icon:'🛡️', title:'Emergency System' },
    { num:42, icon:'⚛️', title:'Quantum Portal' },
    { num:43, icon:'🧬', title:'Bio Monitor' },
    { num:44, icon:'🌀', title:'Dimensions' },
    { num:45, icon:'🧠', title:'Collective Mind' },
    { num:46, icon:'⌛', title:'Time Stream' },
    { num:47, icon:'🌍', title:'Translator' },
    { num:48, icon:'⚡', title:'Energy Flow' },
    { num:49, icon:'🌙', title:'Dream Bridge' },
    { num:50, icon:'🚀', title:'Cosmic Mission' },
  ];

  let currentSlide = 1;
  let currentLang = 'en';

  // ─── BUILD RAIL ────────────────────────────────────────────────
  function buildRail() {
    const rail = document.getElementById('slideRail');
    rail.innerHTML = SLIDES.map(s => `
      <div class="slide-thumb ${s.num === currentSlide ? 'active' : ''}"
        id="thumb-${s.num}"
        onclick="goToSlide(${s.num})"
        title="${s.title}">
        <span class="slide-thumb-icon">${s.icon}</span>
        <span class="slide-thumb-num">${String(s.num).padStart(2,'0')}</span>
      </div>`).join('');
  }

  // ─── NAVIGATE ──────────────────────────────────────────────────
  function goToSlide(num) {
    num = Math.max(1, Math.min(50, num));
    currentSlide = num;

    // Update iframe
    const iframe = document.getElementById('slideIframe');
    const padded = String(num).padStart(2, '0');
    iframe.src = `slides/slide-${padded}.html`;

    // Pass lang to iframe after load
    iframe.onload = () => {
      try {
        iframe.contentWindow.Loader && iframe.contentWindow.Loader.switchLanguage(currentLang);
      } catch(e) {}
    };

    // Update counter
    document.getElementById('slideCounter').textContent =
      `${String(num).padStart(2,'0')} / 50`;

    // Update rail active
    document.querySelectorAll('.slide-thumb').forEach(t => t.classList.remove('active'));
    const activeThumb = document.getElementById(`thumb-${num}`);
    if (activeThumb) {
      activeThumb.classList.add('active');
      activeThumb.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
    }

    // Update progress ribbon
    document.getElementById('progressRibbon').style.width = `${(num / 50) * 100}%`;
  }

  function navigate(dir) {
    goToSlide(currentSlide + dir);
  }

  // ─── LANGUAGE ──────────────────────────────────────────────────
  function switchLang(lang) {
    currentLang = lang;
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    document.body.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    localStorage.setItem('2030b_lang', lang);

    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });

    // Reload current slide with new lang
    const iframe = document.getElementById('slideIframe');
    const padded = String(currentSlide).padStart(2,'0');
    iframe.src = `slides/slide-${padded}.html`;
    iframe.onload = () => {
      try {
        iframe.contentWindow.Loader && iframe.contentWindow.Loader.switchLanguage(lang);
      } catch(e) {}
    };
  }

  // ─── QUICK JUMP ────────────────────────────────────────────────
  function toggleSlideInput() {
    const overlay = document.getElementById('jumpOverlay');
    overlay.style.display = 'flex';
    setTimeout(() => document.getElementById('jumpInput').focus(), 100);
  }

  function closeJump() {
    document.getElementById('jumpOverlay').style.display = 'none';
  }

  function doJump() {
    const val = parseInt(document.getElementById('jumpInput').value);
    if (val >= 1 && val <= 50) goToSlide(val);
    closeJump();
  }

  function handleJumpKey(e) {
    if (e.key === 'Enter') doJump();
    if (e.key === 'Escape') closeJump();
  }

  // ─── KEYBOARD NAV ──────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('jumpOverlay').style.display === 'flex') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault();
      navigate(1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      navigate(-1);
    }
  });

  // ─── TOUCH SWIPE ───────────────────────────────────────────────
  let touchStartX = 0;
  let touchStartY = 0;

  document.getElementById('carouselWrapper').addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.getElementById('carouselWrapper').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      navigate(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  // ─── INIT ──────────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    // Restore lang
    const savedLang = localStorage.getItem('2030b_lang') || 'en';
    currentLang = savedLang;
    if (savedLang === 'ar') {
      document.documentElement.setAttribute('dir', 'rtl');
      document.documentElement.setAttribute('lang', 'ar');
      document.body.setAttribute('dir', 'rtl');
      document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.lang === savedLang);
      });
    }

    // Build rail
    buildRail();

    // Init particles
    AnimationSystem.initParticles('particles-canvas', 20);

    // Show loading for 1.2s
    setTimeout(() => {
      document.getElementById('app-loading').classList.add('hidden');
      goToSlide(1);
    }, 1200);
  });
</script>
</body>
</html>
