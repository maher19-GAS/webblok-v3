<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>2030B — كن أذكى | الكتاب التفاعلي v3</title>
  <meta name="description" content="2030B — كن أذكى: الكتاب التفاعلي v3 مع ملاحظات وإشارات مرجعية وتعليقات وتحليل متقدم"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css"/>
  <script>
    tailwind.config={theme:{extend:{fontFamily:{cairo:['Cairo','sans-serif']},
    colors:{brand:{50:'#f0f4ff',400:'#4a7bff',500:'#1a4fff',600:'#0033e0'},
    gold:{400:'#f5c518'},jade:{400:'#2dd4bf'},rose:{400:'#fb7185'},
    violet:{400:'#a78bfa',500:'#8b5cf6'},amber:{400:'#fbbf24'}}}}}
  </script>
<style>
/* ══════════════════════════════════════
   BASE RESET
══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{font-family:'Cairo',sans-serif;background:#07091a;color:#e2e8f0;min-height:100vh;overflow-x:hidden;overflow-y:scroll}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0d1124}
::-webkit-scrollbar-thumb{background:#1a4fff44;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#1a4fff88}

/* ══════════════════════════════════════
   READING PROGRESS
══════════════════════════════════════ */
#reading-progress{position:fixed;top:0;right:0;left:0;height:3px;z-index:9999;background:linear-gradient(90deg,#1a4fff,#8b5cf6,#14b8a6);transform-origin:right;transform:scaleX(0);transition:transform .1s linear}

/* ══════════════════════════════════════
   TOP NAVBAR
══════════════════════════════════════ */
#top-nav{position:fixed;top:3px;right:0;left:0;z-index:500;height:52px;background:rgba(7,9,26,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(26,79,255,.15);display:flex;align-items:center;justify-content:space-between;padding:0 .75rem;gap:.3rem}
.nav-brand{display:flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:800;color:#c7d2fe;white-space:nowrap;flex-shrink:0}
.nav-brand span{color:#4a7bff}
.nav-icon-btn{position:relative;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:.5rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#94a3b8;font-size:.88rem;cursor:pointer;transition:all .18s;flex-shrink:0;user-select:none;font-family:'Cairo',sans-serif}
.nav-icon-btn:hover{background:rgba(26,79,255,.15);color:#818cf8;border-color:rgba(26,79,255,.3)}
.nav-icon-btn.active{background:rgba(26,79,255,.25);color:#818cf8;border-color:rgba(26,79,255,.5)}
/* annotation colour states */
.nav-icon-btn.an-note    {background:rgba(245,197,24,.18);color:#fde68a;border-color:rgba(245,197,24,.4)}
.nav-icon-btn.an-bookmark{background:rgba(251,113,133,.18);color:#fda4af;border-color:rgba(251,113,133,.4)}
.nav-icon-btn.an-comment {background:rgba(45,212,191,.18);color:#6ee7b7;border-color:rgba(45,212,191,.4)}
.nav-icon-btn.an-share   {background:rgba(139,92,246,.18);color:#c4b5fd;border-color:rgba(139,92,246,.4)}
.nav-icon-btn.an-history {background:rgba(251,191,36,.15);color:#fbbf24;border-color:rgba(251,191,36,.4)}
/* tooltip — mobile/hover (hidden on desktop where labels show) */
.nav-icon-btn[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;font-size:.7rem;padding:.28rem .55rem;border-radius:.4rem;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;border:1px solid rgba(255,255,255,.1);z-index:8000;direction:rtl}
.nav-icon-btn[data-tip]:hover::after{opacity:1}
.nav-text-label{display:none;font-size:.73rem;font-weight:600;color:inherit}
@media(min-width:768px){
  .nav-text-label{display:inline}
  .nav-icon-btn{width:auto;padding:0 .65rem;gap:.3rem}
  .nav-icon-btn[data-tip]::after{display:none}
}
#nav-progress-text{font-size:.7rem;color:#64748b;font-weight:600;white-space:nowrap;flex-shrink:0}
.nav-count{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;background:#1a4fff;color:#fff;font-size:.55rem;font-weight:900;border-radius:9999px;display:none;align-items:center;justify-content:center;padding:0 3px;border:2px solid #07091a;z-index:1}
.nav-count.show{display:flex}

/* ══════════════════════════════════════
   BOTTOM NAV
══════════════════════════════════════ */
#bottom-nav{position:fixed;bottom:0;right:0;left:0;z-index:500;height:56px;background:rgba(7,9,26,.97);backdrop-filter:blur(16px);border-top:1px solid rgba(26,79,255,.15);display:flex;align-items:center;justify-content:space-between;padding:0 1rem;gap:.5rem}
.bnav-btn{display:flex;align-items:center;gap:.4rem;padding:.5rem .85rem;border-radius:.6rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#94a3b8;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;user-select:none;font-family:'Cairo',sans-serif}
.bnav-btn:hover{background:rgba(26,79,255,.15);color:#c7d2fe;border-color:rgba(26,79,255,.3)}
.bnav-btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.bnav-btn.primary{background:linear-gradient(135deg,#1a4fff,#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 2px 12px rgba(26,79,255,.3)}
.bnav-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(26,79,255,.45)}
.bnav-label{display:none}
@media(min-width:768px){#bottom-nav{height:52px}.bnav-label{display:inline}}
#bnav-counter{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 .5rem;min-width:52px}
.bc-cur{font-size:1.1rem;font-weight:900;color:#e2e8f0;line-height:1}
.bc-tot{font-size:.68rem;color:#475569}

/* ══════════════════════════════════════
   ASIDE SYSTEM
   Right = TOC / Stats / History
   Left  = Notes / Bookmarks / Comments / Share
══════════════════════════════════════ */
#aside-overlay{
  position:fixed;inset:0;z-index:700;
  background:rgba(0,0,0,.72);
  opacity:0;pointer-events:none;
  transition:opacity .3s
}
#aside-overlay.open{opacity:1;pointer-events:all}

.aside-panel{
  position:fixed;top:0;height:100vh;z-index:701;
  width:min(420px,96vw);
  background:#0d1124;
  display:flex;flex-direction:column;
  overflow:hidden;
  /* CRITICAL: contain scroll within aside */
  overscroll-behavior:contain;
  touch-action:pan-y;
  transition:transform .33s cubic-bezier(.4,0,.2,1)
}
.aside-panel.right{right:0;border-left:1px solid rgba(26,79,255,.2);transform:translateX(110%)}
.aside-panel.left {left:0;border-right:1px solid rgba(26,79,255,.2);transform:translateX(-110%)}
.aside-panel.open{transform:translateX(0)}
/* per-panel accent */
#notes-panel    {border-right-color:rgba(245,197,24,.3)}
#bookmarks-panel{border-right-color:rgba(251,113,133,.3)}
#comments-panel {border-right-color:rgba(45,212,191,.3)}
#share-panel    {border-right-color:rgba(139,92,246,.3)}
#history-panel  {border-left-color:rgba(251,191,36,.3)}

.aside-head{padding:.85rem 1rem .7rem;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.aside-head h2{font-size:.9rem;font-weight:800;color:#e2e8f0;display:flex;align-items:center;gap:.45rem}

/* CRITICAL: aside-body MUST contain its own scrolling */
.aside-body{
  overflow-y:auto;
  flex:1;
  padding:.85rem;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch
}
.aside-body::-webkit-scrollbar{width:4px}
.aside-body::-webkit-scrollbar-thumb{background:#1a4fff33;border-radius:2px}

/* ══════════════════════════════════════
   TOC
══════════════════════════════════════ */
.toc-part{font-size:.63rem;font-weight:800;letter-spacing:.12em;color:#4a7bff;text-transform:uppercase;padding:.5rem .4rem .15rem;margin-top:.35rem}
.toc-item{display:flex;align-items:center;gap:.5rem;padding:.45rem .65rem;border-radius:.45rem;cursor:pointer;transition:all .15s;font-size:.78rem;color:#94a3b8;border:1px solid transparent;margin-bottom:2px}
.toc-item:hover{background:rgba(26,79,255,.1);color:#c7d2fe;border-color:rgba(26,79,255,.2)}
.toc-item.active{background:rgba(26,79,255,.18);color:#818cf8;border-color:rgba(26,79,255,.35);font-weight:700}
.ti-num{font-size:.65rem;font-weight:800;color:#4a7bff;min-width:1.5rem}
.ti-slides{margin-right:auto;font-size:.63rem;color:#475569}

/* ══════════════════════════════════════
   STATS CARDS
══════════════════════════════════════ */
.stat-card-p{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:.7rem;padding:.85rem .95rem;margin-bottom:.6rem}
.scp-label{font-size:.68rem;color:#64748b;font-weight:600;margin-bottom:.2rem}
.scp-value{font-size:1.3rem;font-weight:900;color:#e2e8f0}
.scp-sub{font-size:.7rem;color:#475569;margin-top:.15rem}

/* ══════════════════════════════════════
   ANNOTATION CARDS
══════════════════════════════════════ */
.ann-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:.75rem;padding:.85rem .95rem;margin-bottom:.6rem;position:relative;transition:border-color .2s,box-shadow .2s}
.ann-card:hover{border-color:rgba(26,79,255,.25)}
.ann-card .ac-quote{font-size:.77rem;color:#94a3b8;font-style:italic;line-height:1.65;border-right:2px solid #4a7bff33;padding-right:.55rem;margin-bottom:.5rem;cursor:pointer;transition:color .15s}
.ann-card .ac-quote:hover{color:#c7d2fe}
.ann-note     .ac-quote{border-right-color:#f5c518aa}
.ann-bookmark .ac-quote{border-right-color:#fb7185aa}
.ann-comment  .ac-quote{border-right-color:#2dd4bfaa}
.ann-share    .ac-quote{border-right-color:#a78bfaaa}
.ann-card .ac-text{font-size:.81rem;color:#cbd5e1;line-height:1.7;margin-bottom:.4rem}
.ann-card .ac-meta{display:flex;align-items:center;gap:.45rem;font-size:.65rem;color:#475569;flex-wrap:wrap}
.ann-del{position:absolute;top:.5rem;left:.5rem;background:none;border:none;color:#475569;cursor:pointer;font-size:.72rem;opacity:0;transition:opacity .15s;padding:.15rem .3rem;font-family:'Cairo',sans-serif}
.ann-card:hover .ann-del{opacity:1}
.ann-del:hover{color:#fca5a5}
.pill-tag{display:inline-flex;align-items:center;gap:.25rem;padding:.15rem .5rem;border-radius:9999px;font-size:.62rem;font-weight:700;background:rgba(26,79,255,.1);color:#4a7bff;border:1px solid rgba(26,79,255,.2)}
.ann-empty{text-align:center;padding:2.2rem 1rem;color:#475569;font-size:.8rem}
.ann-empty i{font-size:1.8rem;margin-bottom:.6rem;display:block;opacity:.35}
/* comment thread */
.comment-thread{margin-top:.5rem}
.cr-item{display:flex;gap:.5rem;margin-top:.4rem;padding:.4rem;background:rgba(255,255,255,.03);border-radius:.45rem;align-items:flex-start}
.cr-avatar{width:1.55rem;height:1.55rem;border-radius:50%;background:linear-gradient(135deg,#1a4fff,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:800;color:#fff;flex-shrink:0}
.cr-name{font-size:.62rem;font-weight:700;color:#4a7bff}
.cr-text{font-size:.75rem;color:#94a3b8;line-height:1.55}
/* share actions inside share card */
.share-actions{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.55rem}
.share-act-btn{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .65rem;border-radius:.4rem;font-size:.72rem;font-weight:700;border:1px solid;cursor:pointer;transition:all .15s;font-family:'Cairo',sans-serif;text-decoration:none}
/* inline share icon on highlighted text */
.share-inline-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(139,92,246,.35);border:1px solid rgba(139,92,246,.6);color:#c4b5fd;font-size:.55rem;cursor:pointer;vertical-align:middle;margin-right:3px;transition:all .15s;flex-shrink:0}
.share-inline-btn:hover{background:rgba(139,92,246,.6);transform:scale(1.1)}
/* inputs */
.ann-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:.55rem;padding:.5rem .7rem;font-size:.8rem;color:#e2e8f0;font-family:'Cairo',sans-serif;resize:vertical;min-height:60px;outline:none;transition:border-color .2s}
.ann-input:focus{border-color:rgba(26,79,255,.5)}
.ann-input::placeholder{color:#475569}
.btn-sm{display:inline-flex;align-items:center;gap:.3rem;padding:.32rem .7rem;border-radius:.4rem;font-size:.74rem;font-weight:700;cursor:pointer;border:1px solid;transition:all .15s;font-family:'Cairo',sans-serif}
.btn-primary{background:rgba(26,79,255,.18);color:#93c5fd;border-color:rgba(26,79,255,.35)}
.btn-primary:hover{background:rgba(26,79,255,.3)}
.btn-danger{background:rgba(239,68,68,.1);color:#fca5a5;border-color:rgba(239,68,68,.25)}
.btn-danger:hover{background:rgba(239,68,68,.22)}
/* history items */
.hist-item{display:flex;align-items:center;gap:.55rem;padding:.42rem .55rem;border-radius:.4rem;background:rgba(255,255,255,.03);font-size:.76rem;color:#94a3b8;cursor:pointer;transition:background .15s;margin-bottom:3px}
.hist-item:hover{background:rgba(26,79,255,.12);color:#c7d2fe}
.hist-item .hi-icon{color:#4a7bff;width:1rem;text-align:center;flex-shrink:0}
.hist-item .hi-time{margin-right:auto;font-size:.63rem;color:#475569;white-space:nowrap}
.hist-item .hi-del{color:#475569;cursor:pointer;font-size:.7rem;padding:.1rem .2rem;opacity:0;background:none;border:none;font-family:'Cairo',sans-serif}
.hist-item:hover .hi-del{opacity:1}
.hist-item .hi-del:hover{color:#fca5a5}
.hist-section-label{font-size:.65rem;font-weight:700;color:#4a7bff;letter-spacing:.08em;text-transform:uppercase;padding:.5rem .3rem .15rem;margin-top:.4rem}

/* ══════════════════════════════════════
   SELECTION TOOLTIP MENU
══════════════════════════════════════ */
#sel-menu{
  position:fixed;z-index:8000;
  background:rgba(8,12,32,.97);
  border:1px solid rgba(255,255,255,.12);
  border-radius:.75rem;
  padding:.3rem .35rem;
  display:none;gap:.25rem;align-items:center;
  box-shadow:0 8px 32px rgba(0,0,0,.65),0 0 0 1px rgba(26,79,255,.12);
  backdrop-filter:blur(20px)
}
#sel-menu.vis{display:flex;animation:selIn .16s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes selIn{from{opacity:0;transform:scale(.82) translateY(-4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.sel-btn{display:flex;flex-direction:column;align-items:center;gap:.18rem;padding:.38rem .5rem;border-radius:.45rem;background:none;border:none;color:#94a3b8;cursor:pointer;font-family:'Cairo',sans-serif;font-size:.58rem;font-weight:700;transition:all .15s;min-width:2.4rem;user-select:none}
.sel-btn i{font-size:.92rem}
.sel-btn:hover{background:rgba(255,255,255,.08);color:#e2e8f0}
.sel-btn.s-note:hover    {color:#fde68a;background:rgba(245,197,24,.12)}
.sel-btn.s-bookmark:hover{color:#fda4af;background:rgba(251,113,133,.12)}
.sel-btn.s-comment:hover {color:#6ee7b7;background:rgba(45,212,191,.12)}
.sel-btn.s-share:hover   {color:#c4b5fd;background:rgba(139,92,246,.12)}
.sel-sep{width:1px;height:26px;background:rgba(255,255,255,.09);flex-shrink:0}
/* caret */
#sel-menu::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:rgba(8,12,32,.97);border-bottom:none}
#sel-menu.below::after{display:none}
#sel-menu.below::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:rgba(8,12,32,.97);border-top:none}

/* ══════════════════════════════════════
   TEXT HIGHLIGHTS
══════════════════════════════════════ */
.wb-hl{border-radius:2px;cursor:pointer;transition:filter .12s;position:relative}
.wb-hl:hover{filter:brightness(1.3)}
.wb-hl-note    {background:rgba(245,197,24,.28);border-bottom:1.5px solid #f5c518bb}
.wb-hl-bookmark{background:rgba(251,113,133,.22);border-bottom:1.5px solid #fb7185bb}
.wb-hl-comment {background:rgba(45,212,191,.2); border-bottom:1.5px solid #2dd4bfbb}
.wb-hl-share   {background:rgba(139,92,246,.22);border-bottom:1.5px solid #a78bfabb}

/* ══════════════════════════════════════
   MAIN SCROLLER / SLIDES
══════════════════════════════════════ */
#slide-scroller{padding-top:55px;padding-bottom:60px}
.book-slide{
  min-height:100vh;
  padding:1rem 1rem 1.5rem;
  display:flex;align-items:flex-start;justify-content:center;
  border-bottom:1px solid rgba(255,255,255,.04);
  position:relative;overflow:hidden;
  opacity:0;transform:translateY(20px);
  transition:opacity .45s ease,transform .45s ease
}
.book-slide.visible{opacity:1;transform:translateY(0)}
.book-slide::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 40% at 50% 0%,var(--sg,rgba(26,79,255,.05)),transparent)}
.slide-type-cover    {--sg:rgba(26,79,255,.12)}
.slide-type-chapter  {--sg:rgba(139,92,246,.09)}
.slide-type-quote    {--sg:rgba(245,197,24,.08)}
.slide-type-science  {--sg:rgba(45,212,191,.08)}
.slide-type-equation {--sg:rgba(139,92,246,.10)}
.slide-type-table    {--sg:rgba(26,79,255,.07)}
.slide-type-list     {--sg:rgba(45,212,191,.06)}
.slide-type-prose    {--sg:rgba(255,255,255,.03)}
.slide-type-cta      {--sg:rgba(26,79,255,.15)}
.book-slide.current::before{background:radial-gradient(ellipse 70% 40% at 50% 0%,var(--sg,rgba(26,79,255,.14)),transparent)}
.slide-inner{width:100%;max-width:860px;padding-top:.5rem}
/* typography */
.s-badge{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .8rem;border-radius:9999px;font-size:.67rem;font-weight:800;letter-spacing:.07em;margin-bottom:1rem;border:1px solid}
.s-title{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:900;line-height:1.28;color:#f1f5f9;margin-bottom:.5rem}
.s-body{font-size:clamp(.86rem,1.8vw,1rem);line-height:2;color:#cbd5e1}
.s-body p{margin-bottom:1rem}
.s-body strong{color:#f1f5f9;font-weight:700}
.s-body em{color:#93c5fd;font-style:normal;font-weight:600}
.s-quran{background:linear-gradient(135deg,rgba(245,197,24,.07),rgba(167,139,250,.07));border:1px solid rgba(245,197,24,.22);border-radius:.75rem;padding:1rem 1.2rem;margin:1.2rem 0;font-size:1.02rem;font-weight:700;color:#fde68a;line-height:2;text-align:center}
.s-quran .sq-ref{font-size:.72rem;color:#a78bfa;margin-top:.3rem}
.s-quote{border-right:3px solid #4a7bff;padding:.85rem 1rem;margin:1.2rem 0;background:rgba(26,79,255,.06);border-radius:0 .5rem .5rem 0;font-size:.9rem;color:#93c5fd;line-height:1.9}
.s-quote cite{display:block;margin-top:.35rem;color:#64748b;font-style:normal;font-size:.75rem}
.s-equation{background:rgba(139,92,246,.07);border:1px solid rgba(139,92,246,.25);border-radius:.75rem;padding:1rem 1.2rem;margin:1.2rem 0;text-align:center;font-size:.92rem;font-weight:700;color:#c4b5fd;letter-spacing:.02em;line-height:1.9}
.s-grid{display:grid;gap:.85rem;margin:1.1rem 0}
.s-grid.g2{grid-template-columns:1fr 1fr}.s-grid.g3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:600px){.s-grid.g2,.s-grid.g3{grid-template-columns:1fr}}
.s-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:.7rem;padding:.85rem .95rem;transition:border-color .2s}
.s-card:hover{border-color:rgba(26,79,255,.3)}
.s-table{width:100%;border-collapse:collapse;font-size:.8rem;margin:1.1rem 0;border-radius:.6rem;overflow:hidden}
.s-table thead tr{background:rgba(26,79,255,.16)}
.s-table thead th{padding:.6rem .8rem;text-align:right;color:#818cf8;font-weight:700}
.s-table tbody tr{border-bottom:1px solid rgba(255,255,255,.04)}
.s-table tbody tr:hover{background:rgba(255,255,255,.03)}
.s-table td{padding:.55rem .8rem;color:#cbd5e1;vertical-align:top}

<script>
'use strict';
/* ═══════════════════════════════════════════════════════
   BOOK CONFIG
═══════════════════════════════════════════════════════ */
const CFG = {
  title: '2030B — كن أذكى',
  files: [
    {path:'book/prologue-toc.md',          part:'المقدمة والفهرس',              id:'prologue'},
    {path:'book/chapter-01.md',            part:'الجزء الأول — القصة والرؤية', id:'ch01'},
    {path:'book/chapter-02.md',            part:'الجزء الأول — القصة والرؤية', id:'ch02'},
    {path:'book/chapters-03-04.md',        part:'الجزء الأول + الثاني',         id:'ch03-04'},
    {path:'book/chapters-05-06-07.md',     part:'الجزء الثاني — SelfAI',        id:'ch05-07'},
    {path:'book/chapters-08-12-epilog.md', part:'الجزء الثالث والرابع',         id:'ch08-12'},
  ],
  mob:{min:120,max:170},
  desk:{min:450,max:550},
  wpm:200,
  dbName:'wb3_v3',
  dbVersion:1,
};

/* ═══════════════════════════════════════════════════════
   INDEXEDDB  — 5 stores:
     kv       key/value (settings & stats)
     cache    markdown file cache
     anns     annotations (note | bookmark | comment | share)
     replies  comment sub-replies
     activity activity log
═══════════════════════════════════════════════════════ */
let DB = null;

function openDB(){
  return new Promise(res=>{
    const r = indexedDB.open(CFG.dbName, CFG.dbVersion);
    r.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('kv'))
        d.createObjectStore('kv',{keyPath:'k'});
      if(!d.objectStoreNames.contains('cache'))
        d.createObjectStore('cache',{keyPath:'id'});
      if(!d.objectStoreNames.contains('anns')){
        const s = d.createObjectStore('anns',{keyPath:'id',autoIncrement:true});
        s.createIndex('type','type');
        s.createIndex('slideIndex','slideIndex');
        s.createIndex('hlId','hlId');
      }
      if(!d.objectStoreNames.contains('replies')){
        const s = d.createObjectStore('replies',{keyPath:'id',autoIncrement:true});
        s.createIndex('annId','annId');
      }
      if(!d.objectStoreNames.contains('activity')){
        const s = d.createObjectStore('activity',{keyPath:'id',autoIncrement:true});
        s.createIndex('ts','ts');
        s.createIndex('type','type');
      }
    };
    r.onsuccess = e=>{ DB=e.target.result; res(DB); };
    r.onerror   = ()=>res(null);
  });
}

const tx = (s,m='readonly')=>{
  if(!DB) return null;
  try{ return DB.transaction(s,m); }catch{ return null; }
};
const kvPut   = (k,v)=>new Promise(r=>{ const t=tx('kv','readwrite'); if(!t){r();return;} t.objectStore('kv').put({k,v}).onsuccess=()=>r(); });
const kvGet   = k =>new Promise(r=>{ const t=tx('kv'); if(!t){r(null);return;} const q=t.objectStore('kv').get(k); q.onsuccess=e=>r(e.target.result?.v??null); q.onerror=()=>r(null); });
const kvInc   = (k,by=1)=>kvGet(k).then(v=>kvPut(k,(v||0)+by));
const storeAdd=(s,d)=>new Promise(r=>{ const t=tx(s,'readwrite'); if(!t){r(null);return;} const q=t.objectStore(s).add(d); q.onsuccess=e=>r(e.target.result); q.onerror=()=>r(null); });
const storePut=(s,d)=>new Promise(r=>{ const t=tx(s,'readwrite'); if(!t){r(null);return;} const q=t.objectStore(s).put(d); q.onsuccess=e=>r(e.target.result); q.onerror=()=>r(null); });
const storeGet=(s,k)=>new Promise(r=>{ const t=tx(s); if(!t){r(null);return;} const q=t.objectStore(s).get(k); q.onsuccess=e=>r(e.target.result||null); q.onerror=()=>r(null); });
const storeAll=(s)  =>new Promise(r=>{ const t=tx(s); if(!t){r([]);return;} const q=t.objectStore(s).getAll(); q.onsuccess=e=>r(e.target.result||[]); q.onerror=()=>r([]); });
const storeIdx=(s,i,v)=>new Promise(r=>{ const t=tx(s); if(!t){r([]);return;} const q=t.objectStore(s).index(i).getAll(v); q.onsuccess=e=>r(e.target.result||[]); q.onerror=()=>r([]); });
const storeDel=(s,k)=>new Promise(r=>{ const t=tx(s,'readwrite'); if(!t){r();return;} t.objectStore(s).delete(k).onsuccess=()=>r(); });
const storeClear=s=>{ const t=tx(s,'readwrite'); if(t) t.objectStore(s).clear(); };

/* ─── ACTIVITY LOG ─── */
async function logActivity(type,label,meta={}){
  await storeAdd('activity',{type,label,meta,ts:Date.now()});
  const all = await storeAll('activity');
  if(all.length>250){
    const t = tx('activity','readwrite');
    if(t) all.slice(0,all.length-250).forEach(r=>t.objectStore('activity').delete(r.id));
  }
  refreshCounts();
}

/* ─── MD CACHE (first-load only) ─── */
const cacheSet = (id,content)=>storePut('cache',{id,content,ts:Date.now()});
const cacheGet = async id=>{ const r=await storeGet('cache',id); return r?.content||null; };

/* ─── ANNOTATION CRUD ─── */
const TYPE_META={
  note:    {icon:'fa-pen-to-square',label:'ملاحظة', color:'#fde68a',hlCls:'wb-hl-note',    bodyEl:'notes-body',    panelName:'notes'},
  bookmark:{icon:'fa-bookmark',     label:'مفضلة',  color:'#fda4af',hlCls:'wb-hl-bookmark', bodyEl:'bookmarks-body',panelName:'bookmarks'},
  comment: {icon:'fa-comment',      label:'تعليق',  color:'#6ee7b7',hlCls:'wb-hl-comment',  bodyEl:'comments-body', panelName:'comments'},
  share:   {icon:'fa-share-nodes',  label:'مشاركة', color:'#c4b5fd',hlCls:'wb-hl-share',    bodyEl:'share-body',    panelName:'share'},
};

async function annCreate(type,selText,noteText,slideIdx,hlId){
  const id = await storeAdd('anns',{type,selText,noteText,slideIdx,hlId,created:Date.now(),updated:Date.now()});
  await logActivity('annotation',`${TYPE_META[type]?.label||type}: "${selText.slice(0,40)}"`,{annId:id,type,slideIdx});
  return id;
}
async function annUpdate(id,noteText){
  const a=await storeGet('anns',id); if(!a)return;
  a.noteText=noteText; a.updated=Date.now();
  await storePut('anns',a);
}
async function annDelete(id){
  const a=await storeGet('anns',id); if(!a)return;
  // remove DOM highlights
  document.querySelectorAll(`[data-aid="${id}"]`).forEach(span=>{
    const frag=document.createDocumentFragment();
    span.childNodes.forEach(n=>frag.appendChild(n.cloneNode(true)));
    span.replaceWith(frag);
  });
  // remove inline share buttons
  document.querySelectorAll(`[data-share-ann="${id}"]`).forEach(btn=>btn.remove());
  const replies=await storeIdx('replies','annId',id);
  for(const r of replies) await storeDel('replies',r.id);
  await storeDel('anns',id);
  await logActivity('delete',`حذف تعليق #${id}`,{annId:id});
}
const getAnns     = type   =>storeIdx('anns','type',type);

/* ═══════════════════════════════════════════════════════
   MARKDOWN PARSER
═══════════════════════════════════════════════════════ */
function parseMD(md){
  const lines = md.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  const B=[]; let i=0;
  while(i<lines.length){
    const raw=lines[i], t=raw.trim();
    if(!t){i++;continue;}
    // HR
    if(/^(-{3,}|_{3,}|\*{3,})$/.test(t)){B.push({type:'hr'});i++;continue;}
    // Heading
    const hm=t.match(/^(#{1,4})\s+(.+)$/);
    if(hm){B.push({type:'heading',level:hm[1].length,text:hm[2]});i++;continue;}
    // Blockquote
    if(t.startsWith('>')){
      const ql=[];
      while(i<lines.length&&lines[i].trim().startsWith('>')){ql.push(lines[i].trim().replace(/^>\s?/,''));i++;}
      if(ql.join('').trim()) B.push({type:'quote',text:ql.join(' ').trim()});
      continue;
    }
    // Fenced code
    if(t.startsWith('```')){
      const cl=[]; i++;
      while(i<lines.length&&!lines[i].trim().startsWith('```')){cl.push(lines[i]);i++;}
      i++; if(cl.join('').trim()) B.push({type:'code',text:cl.join('\n')});
      continue;
    }
    // Table
    if(t.startsWith('|')&&t.endsWith('|')){
      const rows=[]; let hd=false;
      while(i<lines.length&&lines[i].trim().startsWith('|')){
        const row=lines[i].trim();
        if(/^\|[\s\-:|]+\|$/.test(row.replace(/\s/g,''))){hd=true;i++;continue;}
        rows.push({isHeader:!hd,cells:row.split('|').slice(1,-1).map(c=>c.trim())});i++;
      }
      if(rows.length) B.push({type:'table',rows}); continue;
    }
    // Unordered list
    if(/^[-*+]\s/.test(t)){
      const items=[];
      while(i<lines.length&&/^[-*+]\s/.test(lines[i].trim())){items.push(lines[i].trim().replace(/^[-*+]\s/,''));i++;}
      B.push({type:'list',items}); continue;
    }
    // Ordered list
    if(/^\d+[.)]\s/.test(t)){
      const items=[];
      while(i<lines.length&&/^\d+[.)]\s/.test(lines[i].trim())){items.push(lines[i].trim().replace(/^\d+[.)]\s/,''));i++;}
      B.push({type:'nlist',items}); continue;
    }
    // Paragraph (accumulate consecutive lines)
    const pl=[];
    while(i<lines.length){
      const tt=lines[i].trim();
      if(!tt||/^#{1,4}\s/.test(tt)||tt.startsWith('>')||/^[-*+]\s/.test(tt)||/^\d+[.)]\s/.test(tt)||tt.startsWith('|')||tt.startsWith('```')||/^(-{3,}|_{3,}|\*{3,})$/.test(tt)) break;
      pl.push(tt); i++;
    }
    if(pl.length){ const text=pl.join(' ').trim(); if(text) B.push({type:'para',text}); }
  }
  return B;
}

/* ═══════════════════════════════════════════════════════
   CLASSIFIER & SPLITTER
═══════════════════════════════════════════════════════ */
function classify(blocks,gi){
  if(gi===0) return 'cover';
  const txt=blocks.map(b=>b.text||(b.items||[]).join(' ')||'').join(' ');
  if(blocks.some(b=>b.type==='table')) return 'table';
  if(blocks.some(b=>b.type==='code'))  return 'equation';
  if(blocks.some(b=>b.type==='quote')||/﴿[^﴾]{2,}﴾/.test(txt)) return 'quote';
  if(blocks.some(b=>b.type==='heading'&&b.level<=2)){
    const h=blocks.find(b=>b.type==='heading'&&b.level<=2);
    if(h&&/الفصل|المقدمة|الخاتمة|الجزء|الميثاق|المشروع|المعجزة/.test(h.text)) return 'chapter';
  }
  if(blocks.some(b=>(b.type==='list'||b.type==='nlist')&&(b.items||[]).length>=3)) return 'list';
  if(/معادلة|صيرورة|مراحل|خوارزمية|مبدأ|طبقات|النموذج|المعمار/.test(txt)) return 'science';
  if(/2030B\.com|اشترك|ابدأ التحدي|انضم|واحد وعشرون|21 يومًا/.test(txt)) return 'cta';
  return 'prose';
}
const wc  = s=>s?s.trim().split(/\s+/).filter(Boolean).length:0;
const bwc = b=>{
  if(b.type==='table') return (b.rows||[]).reduce((s,r)=>s+wc(r.cells.join(' ')),0);
  return wc(b.text||(b.items||[]).join(' ')||'');
};

function split(blocks,fileId,part,off){
  const mob=window.innerWidth<768, T=mob?CFG.mob:CFG.desk;
  const slides=[]; let cur=[],cw=0,cTitle='',cSub='',cNum=0,isFst=true;
  const flush=ft=>{
    if(!cur.length) return;
    const gi=off+slides.length;
    slides.push({blocks:[...cur],chapterTitle:cTitle,chapterSubtitle:cSub,chapterNum:cNum,part,fileId,slideType:ft||classify(cur,gi),isOpener:isFst});
    isFst=false; cur=[]; cw=0;
  };
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];
    if(b.type==='heading'&&b.level<=2){
      flush();
      cTitle=b.text.replace(/\*\*/g,'').trim(); isFst=true; cSub='';
      if(/الفصل\s*(الأول|الثاني|الثالث|الرابع|الخامس|السادس|السابع|الثامن|التاسع|العاشر|الحادي|الثاني\s*عشر|\d+)/.test(b.text)) cNum++;
      cur.push(b); cw+=bwc(b); continue;
    }
    if(b.type==='heading'&&b.level===3){
      if(cw>=T.min) flush();
      cSub=b.text.replace(/\*\*/g,'').trim(); cur.push(b); cw+=bwc(b); continue;
    }
    if(b.type==='heading'&&b.level===4){ cur.push(b); cw+=bwc(b); continue; }
    if(b.type==='hr'){ if(cw>=T.min) flush(); continue; }
    if(b.type==='table'||b.type==='code'){ if(cur.length) flush(); cur.push(b); flush(); continue; }
    const bw=bwc(b);
    if(cw>0&&cw+bw>T.max&&cw>=T.min) flush();
    cur.push(b); cw+=bw;
    if(cw>=T.max) flush();
  }
  flush();
  return slides;
}

/* ═══════════════════════════════════════════════════════
   RENDERER
═══════════════════════════════════════════════════════ */
const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function inline(s){
  if(!s) return '';
  return s
    .replace(/﴿([^﴾]*)﴾/g,'<span style="color:#fde68a;font-weight:700">﴿$1﴾</span>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/__([^_]+)__/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/_([^_\n]+)_/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code style="background:rgba(139,92,246,.15);color:#c4b5fd;padding:.1rem .3rem;border-radius:.3rem;font-size:.9em">$1</code>');
}

function renderBlocks(blocks){
  return blocks.map(b=>{
    switch(b.type){
      case 'heading':
        if(b.level<=2) return '';
        if(b.level===3) return `<div style="font-size:clamp(.98rem,2.4vw,1.28rem);font-weight:800;color:#c7d2fe;margin:1.15rem 0 .55rem;line-height:1.35">${inline(b.text)}</div>`;
        return `<div style="font-size:.9rem;font-weight:700;color:#94a3b8;margin:.85rem 0 .38rem">${inline(b.text)}</div>`;
      case 'para':
        if(/﴿[^﴾]{4,}﴾/.test(b.text)){
          const rf=(b.text.match(/\(([^)]+:\s*\d+)\)/)||[])[1]||'';
          const v=b.text.replace(/\s*\([^)]+:\s*\d+\)/,'').trim();
          return `<div class="s-quran">${inline(v)}${rf?`<div class="sq-ref">(${rf})</div>`:''}</div>`;
        }
        return `<p class="s-body">${inline(b.text)}</p>`;
      case 'quote':{
        const am=(b.text.match(/—\s*(.+)$/)||[]),au=am[1]?am[1].trim():'';
        const qt=b.text.replace(/—\s*.+$/,'').replace(/^\*([^*]+)\*$/,'$1').trim();
        return `<blockquote class="s-quote">${inline(qt)}${au?`<cite>— ${au}</cite>`:''}</blockquote>`;
      }
      case 'list':
        return `<ul style="list-style:none;padding:0;margin:.8rem 0">${b.items.map(it=>`<li style="margin-bottom:.42rem;padding-right:.28rem;color:#cbd5e1;font-size:clamp(.83rem,1.7vw,.94rem);line-height:1.85"><span style="color:#4a7bff;margin-left:.38rem">◆</span>${inline(it)}</li>`).join('')}</ul>`;
      case 'nlist':
        return `<ol style="list-style:none;padding:0;margin:.8rem 0">${b.items.map((it,idx)=>`<li style="display:flex;gap:.6rem;margin-bottom:.52rem;align-items:flex-start"><span style="min-width:1.65rem;height:1.65rem;background:rgba(26,79,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:900;color:#4a7bff;flex-shrink:0;margin-top:.18rem">${idx+1}</span><span style="color:#cbd5e1;font-size:clamp(.83rem,1.7vw,.94rem);line-height:1.85">${inline(it)}</span></li>`).join('')}</ol>`;
      case 'table':{
        const hr=b.rows.find(r=>r.isHeader),br=b.rows.filter(r=>!r.isHeader);
        const th=hr?`<thead><tr>${hr.cells.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead>`:'';
        const tb=br.map(r=>`<tr>${r.cells.map((c,ci)=>{
          let cl='';
          if(ci===r.cells.length-1){if(/✓|نعم|يدعم/.test(c))cl='good';if(/✗|لا|غير/.test(c))cl='bad';}
          return `<td class="${cl}">${inline(c)}</td>`;
        }).join('')}</tr>`).join('');
        return `<div style="overflow-x:auto;margin:1rem 0"><table class="s-table">${th}<tbody>${tb}</tbody></table></div>`;
      }
      case 'code':{
        const cl=b.text.split('\n');
        if(cl.length<=20) return `<div class="s-equation">${cl.map(l=>inline(l)).join('<br>')}</div>`;
        return `<pre style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:.6rem;padding:.9rem;font-size:.77rem;color:#94a3b8;overflow-x:auto;line-height:1.7;direction:ltr;text-align:left">${esc(b.text)}</pre>`;
      }
      default: return '';
    }
  }).join('');
}

function buildSlide(sd,gi,total){
  const{blocks,chapterTitle:ct,chapterSubtitle:cs,chapterNum:cn,slideType:st,isOpener}=sd;
  const el=document.createElement('section');
  el.className=`book-slide slide-type-${st}`;
  el.dataset.index=gi; el.dataset.title=ct||'';
  const opener=isOpener&&ct?`<div class="s-chapter-opener">${cn?`<div class="s-ch-number">${String(cn).padStart(2,'0')}</div>`:''}<div class="s-ch-title">${inline(ct)}</div>${cs?`<div class="s-ch-subtitle">${inline(cs)}</div>`:''}</div>`:'';
  const compact=!isOpener&&ct?`<div class="compact-ch-label"><i class="fa-solid fa-angles-left" style="font-size:.52rem;color:#4a7bff"></i><span>${inline(ct)}</span></div>`:'';
  const coverH=st==='cover'?`<div class="s-cover-hero"><div class="ch-icon"><i class="fa-solid fa-brain"></i></div></div>`:'';
  const ctaH=st==='cta'?`<div class="s-cta-wrap"><a href="https://2030B.com" target="_blank" class="s-cta-btn"><i class="fa-solid fa-rocket"></i> ابدأ على 2030B.com</a><button class="s-cta-btn outline" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fa-solid fa-rotate-right"></i> العودة</button></div>`:'';
  const hint=gi===0?`<div class="scroll-hint"><i class="fa-solid fa-arrow-down"></i><span>مرّر للأسفل أو استخدم أزرار التنقل</span></div>`:'';
  el.innerHTML=`<div class="slide-inner">${coverH}<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;flex-wrap:wrap;gap:.35rem"><span class="s-badge" style="${BS[st]||BS.prose}"><i class="fa-solid ${BI[st]||'fa-circle'}" style="font-size:.58rem"></i><span>${BL[st]||'نص'}</span></span><span class="slide-num-badge"><i class="fa-solid fa-layer-group" style="font-size:.52rem"></i>${gi+1} / ${total}</span></div>${opener}${compact}<div class="s-body">${renderBlocks(blocks)}</div>${ctaH}${hint}</div>`;
  return el;
}

/* ═══════════════════════════════════════════════════════
   APPLICATION STATE
═══════════════════════════════════════════════════════ */
const S={
  slides:[], els:[], cur:0, total:0, toc:[],
  scrolling:false, activeAside:null,
  edgeState:{top:false,bottom:false},
};

/* ═══════════════════════════════════════════════════════
   NAVIGATION
═══════════════════════════════════════════════════════ */
function goTo(idx,log=true){
  if(idx<0||idx>=S.total) return;
  const el=S.els[idx]; if(!el) return;
  S.scrolling=true;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  S.cur=idx; updateUI();
  if(log){
    const title=S.slides[idx]?.chapterTitle||`شريحة ${idx+1}`;
    kvPut('lastSlide',idx);
    kvInc('slidesViewed');
    logActivity('read',title,{slideIdx:idx});
  }
  setTimeout(()=>{ S.scrolling=false; },800);
}

function updateUI(){
  const idx=S.cur,tot=S.total;
  const pct=tot>1?idx/(tot-1):0;
  document.getElementById('reading-progress').style.transform=`scaleX(${pct})`;
  document.getElementById('bnav-cur').textContent=idx+1;
  document.getElementById('bnav-tot').textContent=`/ ${tot}`;
  document.getElementById('nav-progress-text').textContent=`${idx+1} / ${tot}`;
  document.getElementById('btn-prev').disabled=idx===0;
  document.getElementById('btn-next').disabled=idx===tot-1;
  S.els.forEach((el,i)=>el.classList.toggle('current',i===idx));
  // update TOC active state
  const tocItems=document.querySelectorAll('.toc-item');
  tocItems.forEach((item,ii)=>{
    const si=parseInt(item.dataset.si||0);
    const next=tocItems[ii+1];
    const nsi=next?parseInt(next.dataset.si||tot):tot;
    item.classList.toggle('active',idx>=si&&idx<nsi);
  });
}

/* IntersectionObserver – track current slide by scroll */
function setupIO(){
  const obs=new IntersectionObserver(entries=>{
    if(S.scrolling) return;
    let best=0, bi=S.cur;
    entries.forEach(e=>{
      if(e.isIntersecting&&e.intersectionRatio>best){
        best=e.intersectionRatio;
        bi=parseInt(e.target.dataset.index||0);
      }
    });
    if(bi!==S.cur){
      S.cur=bi; updateUI();
      if(bi%3===0) kvPut('lastSlide',bi);
    }
  },{threshold:[0.3,0.5,0.7],rootMargin:'-48px 0px -56px 0px'});
  S.els.forEach(el=>obs.observe(el));
}

/* Fade-in animations */
function setupAnims(){
  const vo=new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); vo.unobserve(e.target); }});
  },{threshold:0.04});
  S.els.forEach(el=>vo.observe(el));
}

/* Progress bar on scroll */
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  document.getElementById('reading-progress').style.transform=`scaleX(${h>0?Math.min(1,window.scrollY/h):0})`;
},{passive:true});

/* ═══════════════════════════════════════════════════════
   TOC
═══════════════════════════════════════════════════════ */
function buildTOC(){
  const list=document.getElementById('toc-list'); list.innerHTML='';
  const groups={},order=[];
  S.toc.forEach(item=>{
    if(!groups[item.part]){ groups[item.part]=[]; order.push(item.part); }
    groups[item.part].push(item);
  });
  order.forEach(part=>{
    const pe=document.createElement('div'); pe.className='toc-part'; pe.textContent=part; list.appendChild(pe);
    groups[part].forEach((item,idx)=>{
      const nsi=groups[part][idx+1]?.si??S.total;
      const el=document.createElement('div'); el.className='toc-item'; el.dataset.si=item.si;
      el.innerHTML=`<span class="ti-num">${item.num||'✦'}</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.title}</span><span class="ti-slides">${nsi-item.si} شريحة</span>`;
      el.addEventListener('click',()=>{ goTo(item.si); closeAside(); });
      list.appendChild(el);
    });
  });
}

/* ═══════════════════════════════════════════════════════

═══════════════════════════════════════════════════════ */
const ASIDE={
  toc:      {el:'toc-panel',      btn:'btn-toc',       side:'right'},
  stats:    {el:'stats-panel',    btn:'btn-stats',      side:'right'},
  history:  {el:'history-panel',  btn:'btn-history',    side:'right'},
  notes:    {el:'notes-panel',    btn:'btn-notes',      side:'left'},
  bookmarks:{el:'bookmarks-panel',btn:'btn-bookmarks',  side:'left'},
  comments: {el:'comments-panel', btn:'btn-comments',   side:'left'},
  share:    {el:'share-panel',    btn:'btn-share',      side:'left'},
};

function openAside(name){
  if(S.activeAside&&S.activeAside!==name) _closeAside(S.activeAside,false);
  const cfg=ASIDE[name]; if(!cfg) return;
  document.getElementById(cfg.el).classList.add('open');
  document.getElementById('aside-overlay').classList.add('open');
  document.getElementById(cfg.btn).classList.add('active');
  S.activeAside=name;
  // fill content
  const fills={
    toc:buildTOC,
    stats:_fillStats,
    history:_fillHistory,
    notes:()=>_fillAnns('note'),
    bookmarks:()=>_fillAnns('bookmark'),
    comments:()=>_fillAnns('comment'),
    share:_fillShare,
  };
  if(fills[name]) fills[name]();
  // log aside open
  logActivity('aside',`فتح: ${name}`,{panel:name});
}
function _closeAside(name,clearOverlay=true){
  const cfg=ASIDE[name]; if(!cfg) return;
  document.getElementById(cfg.el).classList.remove('open');
  if(clearOverlay) document.getElementById('aside-overlay').classList.remove('open');
  document.getElementById(cfg.btn).classList.remove('active');
  if(S.activeAside===name) S.activeAside=null;
}
const closeAside = ()=>{ if(S.activeAside) _closeAside(S.activeAside); };
const toggleAside= name=>{ S.activeAside===name?closeAside():openAside(name); };

/* ═══════════════════════════════════════════════════════
   FILL — STATS
═══════════════════════════════════════════════════════ */
async function _fillStats(){
  const totalWords=S.slides.reduce((a,sl)=>a+wc(sl.blocks.map(b=>b.text||(b.items||[]).join(' ')).join(' ')),0);
  const readWords=Math.round(((S.cur+1)/Math.max(S.total,1))*totalWords);
  const mins=Math.round(readWords/CFG.wpm);
  const sessions=await kvGet('sessions')||0;
  const longest=await kvGet('longestSession')||0;
  document.getElementById('sp-read').textContent=S.cur+1;
  document.getElementById('sp-pct').textContent=`${Math.round(((S.cur+1)/Math.max(S.total,1))*100)}% (≈${readWords.toLocaleString('ar')} كلمة)`;
  document.getElementById('sp-time').textContent=`${mins} د`;
  document.getElementById('sp-longest').textContent=`${longest} د`;
  document.getElementById('sp-sessions').textContent=`${sessions} جلسة`;
}

/* ═══════════════════════════════════════════════════════
   FILL — HISTORY  (grouped by day, with type icons)
═══════════════════════════════════════════════════════ */
async function _fillHistory(){
  const body=document.getElementById('history-body'); body.innerHTML='';
  const acts=await storeAll('activity');
  if(!acts.length){
    body.innerHTML='<div class="ann-empty"><i class="fa-solid fa-clock-rotate-left"></i>لا يوجد نشاط بعد</div>';
    return;
  }
  const days={};
  [...acts].reverse().forEach(a=>{
    const d=new Date(a.ts);
    const day=d.toLocaleDateString('ar-SA',{weekday:'long',month:'long',day:'numeric'});
    if(!days[day]) days[day]=[];
    days[day].push(a);
  });
  const ICONS={read:'fa-book-open',annotation:'fa-pen-to-square',delete:'fa-trash',aside:'fa-sidebar',navigation:'fa-compass'};
  const COLORS={read:'#4a7bff',annotation:'#fde68a',delete:'#fca5a5',aside:'#6ee7b7',navigation:'#a78bfa'};
  Object.entries(days).forEach(([day,items])=>{
    const dl=document.createElement('div'); dl.className='hist-section-label'; dl.textContent=day; body.appendChild(dl);
    items.forEach(a=>{
      const el=document.createElement('div'); el.className='hist-item';
      const icon=ICONS[a.type]||'fa-circle';
      const color=COLORS[a.type]||'#94a3b8';
      const ts=new Date(a.ts).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
      el.innerHTML=`<span class="hi-icon"><i class="fa-solid ${icon}" style="color:${color}"></i></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.label)}</span><span class="hi-time">${ts}</span><button class="hi-del" title="حذف"><i class="fa-solid fa-xmark"></i></button>`;
      if(a.type==='read'&&a.meta?.slideIdx!=null){
        el.addEventListener('click',e=>{ if(e.target.closest('.hi-del'))return; goTo(a.meta.slideIdx); closeAside(); });
      }
      el.querySelector('.hi-del').addEventListener('click',async e=>{
        e.stopPropagation();
        await storeDel('activity',a.id);
        el.remove();
        refreshCounts();
      });
      body.appendChild(el);
    });
  });
}

async function _fillAnns(type){
  const meta=TYPE_META[type];
  const body=document.getElementById(meta.bodyEl); body.innerHTML='';
  const anns=await getAnns(type);
  if(!anns.length){
    body.innerHTML=`<div class="ann-empty"><i class="fa-solid ${meta.icon}"></i>لا توجد ${meta.label}ات بعد.<br><small style="color:#374151">حدّد نصًا في الكتاب للبدء</small></div>`;
    return;
  }
  [...anns].sort((a,b)=>b.created-a.created).forEach(ann=>body.appendChild(buildAnnCard(ann,type,meta)));
}

function buildAnnCard(ann,type,meta){
  const card=document.createElement('div');
  card.className=`ann-card ann-${type}`;
  card.dataset.cardAnnId=ann.id;
  const d=new Date(ann.created);
  const ts=d.toLocaleString('ar-SA',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const slideTitle=S.slides[ann.slideIdx]?.chapterTitle||`شريحة ${ann.slideIdx+1}`;
  const shareActionsHTML=(type==='share')?_buildShareActHTML(ann):'';

  card.innerHTML=`
    <button class="ann-del" data-del="${ann.id}" title="حذف"><i class="fa-solid fa-trash-can"></i></button>
    <div class="ac-quote" data-jump-ann="${ann.id}">${esc((ann.selText||'').slice(0,130))}${(ann.selText||'').length>130?'…':''}</div>
    ${ann.noteText?`<div class="ac-text">${esc(ann.noteText)}</div>`:''}
    <div class="ac-meta">
      <span class="pill-tag"><i class="fa-solid ${meta.icon}" style="font-size:.52rem"></i> ${meta.label}</span>
      <span><i class="fa-regular fa-clock" style="font-size:.58rem"></i> ${ts}</span>
      <span style="cursor:pointer;color:#4a7bff" data-goto-slide="${ann.slideIdx}"><i class="fa-solid fa-arrow-up-right-from-square" style="font-size:.58rem"></i> ${slideTitle.slice(0,22)}</span>
    </div>
    ${shareActionsHTML}
    ${type==='comment'?`<div class="comment-thread" id="ct-${ann.id}"></div><div style="margin-top:.55rem"><textarea class="ann-input" placeholder="أضف ردًا…" rows="2" id="rt-${ann.id}"></textarea><button class="btn-sm btn-primary" style="margin-top:.3rem" data-send-reply="${ann.id}"><i class="fa-solid fa-paper-plane"></i> إرسال</button></div>`:''}
    ${type==='note'?`<div style="margin-top:.45rem"><textarea class="ann-input" rows="2" id="ne-${ann.id}">${esc(ann.noteText||'')}</textarea><button class="btn-sm btn-primary" style="margin-top:.3rem" data-save-note="${ann.id}"><i class="fa-solid fa-floppy-disk"></i> حفظ</button></div>`:''}
  `;

  card.querySelector('[data-jump-ann]')?.addEventListener('click',()=>scrollToHighlight(ann.id));
  card.querySelector('[data-goto-slide]')?.addEventListener('click',()=>{ goTo(ann.slideIdx); closeAside(); });
  card.querySelector('[data-del]')?.addEventListener('click',async e=>{
    e.stopPropagation();
    await annDelete(ann.id);
    card.remove();
    refreshCounts();
  });
  if(type==='comment') loadReplies(card,ann.id);
  card.querySelector(`[data-send-reply="${ann.id}"]`)?.addEventListener('click',async()=>{
    const ta=document.getElementById(`rt-${ann.id}`);
    if(ta&&ta.value.trim()){ await replyAdd(ann.id,ta.value.trim()); ta.value=''; await loadReplies(card,ann.id); }
  });
  card.querySelector(`[data-save-note="${ann.id}"]`)?.addEventListener('click',async()=>{
    const ta=document.getElementById(`ne-${ann.id}`);
    if(ta){ await annUpdate(ann.id,ta.value); showToast('💾 تم حفظ الملاحظة'); }
  });
  return card;
}

/* ═══════════════════════════════════════════════════════
   HIGHLIGHTS — restore & scroll
═══════════════════════════════════════════════════════ */
async function restoreHighlights(){
  const anns=await storeAll('anns');
  anns.forEach(ann=>{
    const slideEl=S.els[ann.slideIdx]; if(!slideEl) return;
    _injectHighlight(slideEl,ann.selText||'',ann.id,ann.type,ann.hlId);
  });
}

function _injectHighlight(container,selText,annId,type,hlId){
  if(!selText||selText.length<3) return;
  const meta=TYPE_META[type]; if(!meta) return;
  const needle=selText.slice(0,80);
  const walker=document.createTreeWalker(container,NodeFilter.SHOW_TEXT,{
    acceptNode:node=>node.parentElement?.classList.contains('wb-hl')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT
  });
  let node;
  while((node=walker.nextNode())){
    const idx=node.textContent.indexOf(needle);
    if(idx===-1) continue;
    try{
      const range=document.createRange();
      range.setStart(node,idx);
      range.setEnd(node,Math.min(idx+selText.length,node.textContent.length));
      const span=document.createElement('span');
      span.className=`wb-hl ${meta.hlCls}`;
      span.dataset.aid=annId; span.dataset.hlId=hlId||'';
      range.surroundContents(span);
      span.addEventListener('click',()=>openAnnotationPanel(annId,type));
      // add inline share icon for share-type annotations
      if(type==='share') _attachShareIcon(span,annId,ann.slideIdx??S.cur);
    }catch(e){ /* DOM mutation guard */ }
    break;
  }
}

function scrollToHighlight(annId){
  const span=document.querySelector(`[data-aid="${annId}"]`);
  if(!span){ showToast('⚠️ النص المحدد لم يعد موجوداً في هذه الجلسة'); return; }
  S.scrolling=true;
  span.scrollIntoView({behavior:'smooth',block:'center'});
  span.style.outline='2px solid #4a7bff88';
  setTimeout(()=>{ span.style.outline=''; S.scrolling=false; },1500);
}

function openAnnotationPanel(annId,type){
  const pn=TYPE_META[type]?.panelName; if(!pn) return;
  openAside(pn);
  setTimeout(()=>{
    const card=document.querySelector(`[data-card-ann-id="${annId}"]`);
    if(card){
      card.scrollIntoView({behavior:'smooth',block:'center'});
      card.style.boxShadow='0 0 0 2px #4a7bff66';
      setTimeout(()=>card.style.boxShadow='',1400);
    }
  },400);
}

/* Attach inline share icon next to a highlighted span */
function _attachShareIcon(span,annId,slideIdx){
  const btn=document.createElement('button');
  btn.className='share-inline-btn';
  btn.title='مشاركة هذا النص';
  btn.dataset.shareAnn=annId;
  btn.innerHTML='<i class="fa-solid fa-share-nodes"></i>';
  btn.addEventListener('click',async e=>{
    e.stopPropagation();
    const ann=await storeGet('anns',annId);
    if(!ann) return;
    const shareText=`"${ann.selText}"\n— ${CFG.title}`;
    const shareUrl=`${location.origin}${location.pathname}?slide=${slideIdx}&hl=${encodeURIComponent(ann.hlId||'')}`;
    if(navigator.share){
      try{ await navigator.share({title:CFG.title,text:shareText,url:shareUrl}); }catch(e){}
    } else {
      await navigator.clipboard?.writeText(shareUrl);
      showToast('🔗 تم نسخ رابط المقطع');
    }
  });
  span.after(btn);
}

/* ═══════════════════════════════════════════════════════
   DEEP LINK  ?slide=N&hl=hlId
═══════════════════════════════════════════════════════ */
async function handleDeepLink(){
  const p=new URLSearchParams(location.search);
  const sp=p.get('slide'), hlp=p.get('hl');
  if(!sp) return;
  const idx=parseInt(sp);
  if(isNaN(idx)||idx<0||idx>=S.total) return;
  setTimeout(()=>{
    goTo(idx,false);
    if(hlp){
      const decodedHl=decodeURIComponent(hlp);
      setTimeout(()=>{
        const span=document.querySelector(`[data-hl-id="${decodedHl}"]`)||document.querySelector(`[data-aid]`);
        if(span){
          S.scrolling=true;
          span.scrollIntoView({behavior:'smooth',block:'center'});
          span.style.outline='2px solid #a78bfa88';
          setTimeout(()=>{ span.style.outline=''; S.scrolling=false; },2000);
        }
      },800);
    }
  },400);
}

/* ═══════════════════════════════════════════════════════
   SELECTION TOOLTIP — slides only
   Handles BOTH mouse (desktop) and touch (mobile)
   Ignores selections inside asides, navbars, sel-menu
═══════════════════════════════════════════════════════ */
let SEL={text:'',range:null,slideIdx:0};
const SMENU=document.getElementById('sel-menu');

function isInsideSlide(node){
  while(node&&node!==document.body){
    if(node.id==='slide-scroller') return true;
    if(node.classList?.contains('aside-panel')) return false;
    if(node.id==='top-nav'||node.id==='bottom-nav'||node.id==='sel-menu') return false;
    node=node.parentNode;
  }
  return false;
}

const hideSelMenu=()=>{ SMENU.classList.remove('vis'); };

function handleSel(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.toString().trim()){ hideSelMenu(); return; }
  const text=sel.toString().trim();
  if(text.length<3){ hideSelMenu(); return; }
  if(!isInsideSlide(sel.anchorNode)){ hideSelMenu(); return; }
  // find slide index
  let slideIdx=S.cur;
  let node=sel.anchorNode;
  while(node&&node!==document.body){
    if(node.nodeType===1&&node.dataset?.index!=null){ slideIdx=parseInt(node.dataset.index); break; }
    node=node.parentNode;
  }
  SEL={text,range:sel.getRangeAt(0).cloneRange(),slideIdx};
  SMENU.classList.add('vis');
  SMENU.style.display='flex';
  requestAnimationFrame(()=>{
    const rect=sel.getRangeAt(0).getBoundingClientRect();
    const mw=SMENU.offsetWidth||200, mh=SMENU.offsetHeight||55;
    let left=rect.left+rect.width/2-mw/2;
    let top=rect.top-mh-12;
    const below=top<8;
    left=Math.max(6,Math.min(left,window.innerWidth-mw-6));
    if(below){ top=rect.bottom+10; SMENU.classList.add('below'); }
    else SMENU.classList.remove('below');
    SMENU.style.left=left+'px'; SMENU.style.top=top+'px';
  });
}

document.addEventListener('mouseup', e=>{ if(SMENU.contains(e.target)) return; setTimeout(handleSel,12); });
document.addEventListener('touchend',e=>{ if(SMENU.contains(e.target)) return; setTimeout(handleSel,250); },{passive:true});
document.addEventListener('selectionchange',()=>{ if(window.getSelection()?.isCollapsed) hideSelMenu(); });
document.addEventListener('mousedown', e=>{ if(!SMENU.contains(e.target)&&!window.getSelection()?.toString().trim()) hideSelMenu(); });

SMENU.querySelectorAll('.sel-btn').forEach(btn=>{
  btn.addEventListener('mousedown',e=>e.preventDefault());
  btn.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  btn.addEventListener('click',async e=>{
    e.stopPropagation();
    const action=btn.dataset.action;
    const{text,range,slideIdx}=SEL;
    if(!text) return;
    hideSelMenu();
    window.getSelection()?.removeAllRanges();
    await doAnnotate(action,text,range,slideIdx);
  });
});

async function doAnnotate(action,text,range,slideIdx){
  const hlId='hl-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);
  let noteText='';
  if(action==='note')    noteText=prompt('أضف ملاحظتك:','')||'';
  if(action==='comment') noteText=prompt('أضف تعليقك:','')||'';

  // Try to wrap selected range
  let span=null;
  if(range){
    try{
      span=document.createElement('span');
      const meta=TYPE_META[action];
      span.className=`wb-hl ${meta.hlCls}`;
      span.dataset.aid='pending'; span.dataset.hlId=hlId;
      range.surroundContents(span);
    }catch(e){
      console.warn('surroundContents failed:',e.message);
      span=null;
    }
  }

  const id=await annCreate(action,text,noteText,slideIdx,hlId);

  // Update pending span with real id
  if(span){ span.dataset.aid=id; }
  document.querySelectorAll(`[data-hl-id="${hlId}"]`).forEach(s=>{
    s.dataset.aid=id;
    s.addEventListener('click',()=>openAnnotationPanel(id,action));
  });

  // Attach inline share icon for 'share' action
  if(action==='share'&&span){
    _attachShareIcon(span,id,slideIdx);
  }

  // Native share for 'share' action
  if(action==='share'){
    const shareText=`"${text}"\n— ${CFG.title}`;
    const shareUrl=`${location.origin}${location.pathname}?slide=${slideIdx}&hl=${encodeURIComponent(hlId)}`;
    if(navigator.share){
      try{ await navigator.share({title:CFG.title,text:shareText,url:shareUrl}); }catch(e){}
    } else {
      await navigator.clipboard?.writeText(shareUrl);
      showToast('📋 تم نسخ رابط المقطع');
    }
  }

  const pn=TYPE_META[action]?.panelName;
  if(pn) openAside(pn);
  refreshCounts();
}

/* ═══════════════════════════════════════════════════════
   KEYBOARD — ↑↓ scroll within slide, jump at edge
   ←→ always jump slides
═══════════════════════════════════════════════════════ */
const SCROLL_STEP = 180;   // px per arrow press
const EDGE_MARGIN  = 60;   // px from top/bottom to trigger edge detection

// Track if user is at top/bottom of viewport (edge detection)
function _isAtPageTop(){
  return window.scrollY<=EDGE_MARGIN;
}
function _isAtPageBottom(){
  const maxY=document.documentElement.scrollHeight-window.innerHeight;
  return window.scrollY>=maxY-EDGE_MARGIN;
}

// Show edge hint briefly
let _edgeHintTimer={top:null,bottom:null};
function _showEdgeHint(which){
  const el=document.getElementById(`edge-hint-${which}`);
  if(!el) return;
  el.classList.add('show');
  clearTimeout(_edgeHintTimer[which]);
  _edgeHintTimer[which]=setTimeout(()=>el.classList.remove('show'),1200);
}

// Count consecutive arrow presses at edge before jumping
let _edgeCount={top:0,bottom:0};

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  // If focus is inside an open aside, only handle Escape
  if(S.activeAside&&document.getElementById(ASIDE[S.activeAside]?.el)?.contains(e.target)){
    if(e.key==='Escape'){e.preventDefault();closeAside();}
    return;
  }

  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(_isAtPageBottom()){
      _edgeCount.bottom++;
      _showEdgeHint('bottom');
      if(_edgeCount.bottom>=2){ _edgeCount.bottom=0; goTo(S.cur+1); }
    } else {
      _edgeCount.bottom=0; _edgeCount.top=0;
      window.scrollBy({top:SCROLL_STEP,behavior:'smooth'});
    }
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(_isAtPageTop()){
      _edgeCount.top++;
      _showEdgeHint('top');
      if(_edgeCount.top>=2){ _edgeCount.top=0; goTo(S.cur-1); }
    } else {
      _edgeCount.top=0; _edgeCount.bottom=0;
      window.scrollBy({top:-SCROLL_STEP,behavior:'smooth'});
    }
    return;
  }

  // reset edge counts on any other key/scroll
  switch(e.key){
    case 'ArrowLeft': e.preventDefault(); _edgeCount={top:0,bottom:0}; goTo(S.cur+1); break;
    case 'ArrowRight':e.preventDefault(); _edgeCount={top:0,bottom:0}; goTo(S.cur-1); break;
    case ' ':         e.preventDefault(); window.scrollBy({top:window.innerHeight*.75,behavior:'smooth'}); break;
    case 'Home':      e.preventDefault(); goTo(0); break;
    case 'End':       e.preventDefault(); goTo(S.total-1); break;
    case 't':case 'T':toggleAside('toc'); break;
    case 'Escape':    closeAside(); hideSelMenu(); break;
  }
});

// Reset edge counts on manual scroll
window.addEventListener('scroll',()=>{ _edgeCount={top:0,bottom:0}; },{passive:true});

/* ═══════════════════════════════════════════════════════
   TOUCH SWIPE (RTL-aware, ignore if aside is open)
═══════════════════════════════════════════════════════ */
let _tx0=0,_ty0=0;
document.addEventListener('touchstart',e=>{ _tx0=e.touches[0].clientX; _ty0=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',e=>{
  if(SMENU.classList.contains('vis')) return;
  if(S.activeAside) return;
  const dx=_tx0-e.changedTouches[0].clientX;
  const dy=_ty0-e.changedTouches[0].clientY;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>65){
    if(dx>0) goTo(S.cur-1); else goTo(S.cur+1);
  }
},{passive:true});

/* ═══════════════════════════════════════════════════════
   ASIDE SCROLL ISOLATION
   Prevent wheel/touchmove inside aside body from
   propagating to the main window
═══════════════════════════════════════════════════════ */
function lockAsideScroll(){
  document.querySelectorAll('.aside-body').forEach(el=>{
    // wheel
    el.addEventListener('wheel',e=>{ e.stopPropagation(); },{passive:true});
    // touchmove – prevent page scroll only if aside is scrollable
    el.addEventListener('touchmove',e=>{
      e.stopPropagation();
    },{passive:false});
  });
  // Also stop propagation on the aside-panels themselves
  document.querySelectorAll('.aside-panel').forEach(el=>{
    el.addEventListener('wheel',e=>e.stopPropagation(),{passive:true});
  });
}

/* ═══════════════════════════════════════════════════════
   TOAST SYSTEM
═══════════════════════════════════════════════════════ */
function showToast(msg,duration=3200){
  const wrap=document.getElementById('toast-wrap');
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`${msg}<button class="t-close" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>`;
  wrap.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },duration);
}

function showRestoreToast(idx,title){
  const wrap=document.getElementById('toast-wrap');
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML=`<i class="fa-solid fa-bookmark" style="color:#818cf8"></i><span>استمر من: <strong>${esc(title.slice(0,28))}${title.length>28?'…':''}</strong></span><button onclick="goTo(${idx});this.parentElement.remove()" style="margin-right:.4rem;background:rgba(255,255,255,.18);border:none;color:#fff;padding:.2rem .7rem;border-radius:9999px;font-size:.73rem;cursor:pointer;font-family:'Cairo',sans-serif"><i class="fa-solid fa-play" style="font-size:.6rem"></i> استمر</button><button class="t-close" onclick="this.parentElement.remove()"><i class="fa-solid fa-xmark"></i></button>`;
  wrap.appendChild(t);
  requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); },10000);
}

/* ═══════════════════════════════════════════════════════
   SESSION TRACKER
═══════════════════════════════════════════════════════ */
let _sessStart=Date.now();
window.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='hidden'){
    const m=Math.round((Date.now()-_sessStart)/60000);
    if(m>0){ await kvInc('totalMinutes',m); const l=await kvGet('longestSession')||0; if(m>l) kvPut('longestSession',m); }
    kvPut('lastSlide',S.cur);
  }
});
window.addEventListener('beforeunload',()=>kvPut('lastSlide',S.cur));

/* ═══════════════════════════════════════════════════════
   MAIN LOADER — MD caching, single-pass
═══════════════════════════════════════════════════════ */
function setProgress(pct,status){
  document.getElementById('lo-fill').style.width=pct+'%';
  document.getElementById('lo-status').textContent=status;
}

async function loadBook(){
  await openDB();
  setProgress(5,'فحص الذاكرة المؤقتة…');

  const scroller=document.getElementById('slide-scroller');
  const skeleton=document.getElementById('initial-skeleton');
  await new Promise(r=>setTimeout(r,250));

  const allSlides=[]; let off=0, loaded=0;
  const total=CFG.files.length;

  for(let fi=0;fi<total;fi++){
    const fc=CFG.files[fi];
    setProgress(5+Math.round((fi/total)*75),`تحميل: ${fc.id}…`);

    // Try cached MD first (avoids re-fetching on refresh)
    let md=await cacheGet(fc.id);
    if(!md){
      try{
        const res=await fetch(fc.path);
        if(!res.ok){ console.warn('missing:',fc.path); continue; }
        md=await res.text();
        await cacheSet(fc.id,md); // store for next visit
      }catch(e){ console.warn('fetch error:',fc.path,e.message); continue; }
    }

    const slides=split(parseMD(md),fc.id,fc.part,off);
    off+=slides.length; allSlides.push(...slides); loaded++;
    setProgress(5+Math.round(((fi+1)/total)*75),`معالجة: ${fc.id}…`);
  }

  setProgress(85,`بناء ${allSlides.length} شريحة…`);
  await new Promise(r=>setTimeout(r,60));

  if(!allSlides.length){
    skeleton.innerHTML=`<div style="text-align:center;padding:4rem 1.5rem;color:#64748b"><i class="fa-solid fa-triangle-exclamation" style="font-size:1.8rem;color:#f59e0b;margin-bottom:.8rem;display:block"></i><div style="font-size:.95rem;font-weight:700;color:#94a3b8;margin-bottom:.4rem">لم يُعثر على ملفات الكتاب</div><code style="color:#c4b5fd;font-size:.8rem">book/*.md</code></div>`;
    document.getElementById('loading-overlay').classList.add('hidden'); return;
  }

  skeleton.remove();
  S.slides=allSlides; S.total=allSlides.length; S.els=[];

  allSlides.forEach((sd,idx)=>{
    const el=buildSlide(sd,idx,S.total);
    scroller.appendChild(el); S.els.push(el);
    if(sd.isOpener&&sd.chapterTitle)
      S.toc.push({title:sd.chapterTitle,si:idx,part:sd.part,num:sd.chapterNum});
  });

  setProgress(95,'تهيئة الواجهة…');
  setupIO(); setupAnims(); buildTOC(); updateUI();
  lockAsideScroll();
  await refreshCounts();
  await restoreHighlights();

  setProgress(100,'جاهز!');
  await new Promise(r=>setTimeout(r,220));
  document.getElementById('loading-overlay').classList.add('hidden');

  // Deep link takes priority
  await handleDeepLink();

  // Restore last position if no deep link
  if(!location.search.includes('slide=')){
    const last=await kvGet('lastSlide');
    if(last&&last>0&&last<S.total){
      const title=S.slides[last]?.chapterTitle||`شريحة ${last+1}`;
      setTimeout(()=>showRestoreToast(last,title),1000);
    }
  }

  await kvInc('sessions');
  await logActivity('navigation','فتح الكتاب — v3',{});
  console.log(`✅ WebBook v3: ${S.total} slides | ${loaded}/${CFG.files.length} files | ${window.innerWidth<768?'Mobile':'Desktop'} (${window.innerWidth}px)`);
}

/* ═══════════════════════════════════════════════════════
   EVENT LISTENERS
═══════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded',()=>{
  // Bottom nav
  document.getElementById('btn-next').addEventListener('click',()=>goTo(S.cur+1));
  document.getElementById('btn-prev').addEventListener('click',()=>goTo(S.cur-1));

  // Aside toggles
  ['toc','stats','history','notes','bookmarks','comments','share'].forEach(name=>{
    document.getElementById(`btn-${name}`)?.addEventListener('click',()=>toggleAside(name));
    document.getElementById(`btn-close-${name}`)?.addEventListener('click',()=>_closeAside(name));
  });

  // Overlay click
  document.getElementById('aside-overlay').addEventListener('click',closeAside);

  // Clear stats
  document.getElementById('btn-clear-stats')?.addEventListener('click',async()=>{
    storeClear('kv'); showToast('🗑️ تم مسح الإحصاءات'); await _fillStats();
  });

  // Start
  loadBook();
});
</script>
