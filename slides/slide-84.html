<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>2030B – Community Feed</title><link rel="stylesheet" href="../css/styles.css"></head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="slide-container"><div class="slide-bg"></div>
<div id="skeleton" class="slide-inner" style="padding-top:24px"><div style="display:flex;flex-direction:column;gap:10px"><div class="skeleton skeleton-title" style="width:55%"></div>${[1,2,3].map(()=>`<div class="skeleton skeleton-card" style="height:90px;border-radius:12px"></div>`).join('')}</div></div>
<div id="content" class="slide-content" style="display:none;flex-direction:column"></div><div id="footer-nav"></div></div>
<script src="../js/animations.js"></script><script src="../js/loader.js"></script><script src="../js/slide-utils.js"></script>
<script>
function renderSlide84(data,lang){
  return `
    ${buildSlideHeader(data,'🌐')}
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
      ${data.posts.map((p,i)=>`
        <div class="glass-card fade-in" style="padding:13px 14px;animation-delay:${i*80}ms">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
            <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#63B3ED,#9F7AEA);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0">${p.avatar}</div>
            <div style="flex:1">
              <div style="display:flex;align-items:center;gap:5px">
                <span style="font-size:12px;font-weight:700;color:#fff">${p.author}</span>
                ${p.badges.map(b=>`<span style="font-size:12px">${b}</span>`).join('')}
              </div>
              <div style="font-size:10px;color:rgba(255,255,255,0.35)">${p.time}</div>
            </div>
          </div>
          <div style="font-size:12px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:8px">${p.content}</div>
          <div style="display:flex;gap:14px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05)">
            <button style="display:flex;align-items:center;gap:4px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:11px;cursor:pointer">❤️ ${p.likes}</button>
            <button style="display:flex;align-items:center;gap:4px;background:none;border:none;color:rgba(255,255,255,0.4);font-size:11px;cursor:pointer">💬 ${p.comments}</button>
          </div>
        </div>`).join('')}
    </div>`;
}
initSlide(84,renderSlide84,{jsonFile:'../en2.json',slideIndex:33});
</script></body></html>
