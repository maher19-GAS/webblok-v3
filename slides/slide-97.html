<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>2030B – The Team</title><link rel="stylesheet" href="../css/styles.css"></head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="slide-container"><div class="slide-bg"></div>
<div id="skeleton" class="slide-inner" style="padding-top:24px"><div style="display:flex;flex-direction:column;gap:10px"><div class="skeleton skeleton-title" style="width:55%"></div>${[1,2,3,4].map(()=>`<div class="skeleton skeleton-card" style="height:70px;border-radius:12px"></div>`).join('')}</div></div>
<div id="content" class="slide-content" style="display:none;flex-direction:column"></div><div id="footer-nav"></div></div>
<script src="../js/animations.js"></script><script src="../js/loader.js"></script><script src="../js/slide-utils.js"></script>
<script>
function renderSlide97(data,lang){
  const gradients=['linear-gradient(135deg,#63B3ED,#9F7AEA)','linear-gradient(135deg,#9F7AEA,#FC8181)','linear-gradient(135deg,#68D391,#63B3ED)','linear-gradient(135deg,#F6AD55,#9F7AEA)'];
  return `
    ${buildSlideHeader(data,'👑')}
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
      ${data.leadership.map((l,i)=>`
        <div class="glass-card fade-in" style="padding:12px 14px;animation-delay:${i*70}ms;display:flex;gap:12px;align-items:center">
          <div style="width:44px;height:44px;border-radius:50%;background:${gradients[i%gradients.length]};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0">${l.avatar}</div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:700;color:#fff">${l.name}</div>
            <div style="font-size:11px;color:#63B3ED;margin-top:1px">${l.role}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px">${l.bg}</div>
          </div>
        </div>`).join('')}
      <!-- Team Stats -->
      <div class="glass-card fade-in" style="padding:10px">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px">
          <div><div style="font-size:15px;font-weight:800;color:#63B3ED">${data.team_size}</div><div style="font-size:9px;color:rgba(255,255,255,0.35)">Team</div></div>
          <div><div style="font-size:15px;font-weight:800;color:#68D391">${data.engineering_pct}%</div><div style="font-size:9px;color:rgba(255,255,255,0.35)">Engineering</div></div>
          <div><div style="font-size:15px;font-weight:800;color:#F6AD55">${data.open_roles}</div><div style="font-size:9px;color:rgba(255,255,255,0.35)">Open Roles</div></div>
          <div><div style="font-size:15px;font-weight:800;color:#9F7AEA">38</div><div style="font-size:9px;color:rgba(255,255,255,0.35)">Nations</div></div>
        </div>
      </div>
      <div class="glass-card fade-in" style="padding:9px 14px;text-align:center">
        <div style="font-size:11px;color:rgba(255,255,255,0.5)">🌍 ${data.culture_note}</div>
      </div>
    </div>`;
}
initSlide(97,renderSlide97,{jsonFile:'../en2.json',slideIndex:46});
</script></body></html>
