<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>2030B – Join the Revolution</title><link rel="stylesheet" href="../css/styles.css"></head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="slide-container"><div class="slide-bg"></div>
<div id="skeleton" class="slide-inner" style="padding-top:24px"><div style="display:flex;flex-direction:column;gap:10px"><div class="skeleton skeleton-title" style="width:65%"></div><div class="skeleton skeleton-card" style="height:90px;border-radius:14px"></div><div class="skeleton skeleton-card" style="height:50px;border-radius:12px"></div></div></div>
<div id="content" class="slide-content" style="display:none;flex-direction:column"></div><div id="footer-nav"></div></div>
<script src="../js/animations.js"></script><script src="../js/loader.js"></script><script src="../js/slide-utils.js"></script>
<script>
function renderSlide99(data,lang){
  const ctaStyles={primary:'background:linear-gradient(135deg,#63B3ED,#9F7AEA);color:#fff;border:none;',secondary:'background:rgba(99,179,237,0.1);color:#63B3ED;border:1px solid rgba(99,179,237,0.25);',ghost:'background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.1);'};
  return `
    ${buildSlideHeader(data,'🌍')}
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:14px">
      <!-- Message -->
      <div class="glass-card fade-in" style="padding:16px;text-align:center;background:linear-gradient(135deg,rgba(99,179,237,0.07),rgba(159,122,234,0.07))">
        <div style="font-size:12px;color:rgba(255,255,255,0.65);line-height:1.75">${data.message}</div>
      </div>
      <!-- CTA Buttons -->
      <div style="display:flex;flex-direction:column;gap:8px">
        ${data.ctas.map((c,i)=>`
          <button class="fade-in" style="animation-delay:${i*0.08}s;width:100%;padding:13px;border-radius:12px;${ctaStyles[c.type]||ctaStyles.ghost}font-size:13px;font-weight:700;cursor:pointer;transition:opacity 0.2s" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">${c.label}</button>`).join('')}
      </div>
      <!-- Social Proof -->
      <div class="glass-card fade-in" style="padding:10px 14px;text-align:center;animation-delay:0.25s">
        <div style="font-size:12px;color:rgba(255,255,255,0.65)">${data.social_proof}</div>
        <div style="font-size:11px;color:rgba(255,179,64,0.6);margin-top:4px">${data.hashtag}</div>
      </div>
    </div>`;
}
initSlide(99,renderSlide99,{jsonFile:'../en2.json',slideIndex:48});
</script></body></html>
