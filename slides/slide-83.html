<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>2030B – Economy Snapshot</title><link rel="stylesheet" href="../css/styles.css"></head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="slide-container"><div class="slide-bg"></div>
<div id="skeleton" class="slide-inner" style="padding-top:24px"><div style="display:flex;flex-direction:column;gap:10px"><div class="skeleton skeleton-title" style="width:55%"></div><div class="skeleton skeleton-card" style="height:100px;border-radius:14px"></div><div class="skeleton skeleton-card" style="height:80px;border-radius:12px"></div></div></div>
<div id="content" class="slide-content" style="display:none;flex-direction:column"></div><div id="footer-nav"></div></div>
<script src="../js/animations.js"></script><script src="../js/loader.js"></script><script src="../js/slide-utils.js"></script>
<script>
function renderSlide83(data,lang){
  const w=data.wallet;
  return `
    ${buildSlideHeader(data,'💼')}
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:12px">
      <!-- Wallet Breakdown -->
      <div class="glass-card fade-in" style="padding:16px;background:linear-gradient(135deg,rgba(104,211,145,0.08),rgba(99,179,237,0.06))">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,0.4);margin-bottom:8px">Total Balance</div>
        <div style="font-size:28px;font-weight:900;color:#68D391;margin-bottom:12px">${w.total}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
          <div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:8px;text-align:center">
            <div style="font-size:12px;font-weight:700;color:#63B3ED">${w.liquid}</div>
            <div style="font-size:9px;color:rgba(255,255,255,0.35);margin-top:2px">Liquid</div>
          </div>
          <div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:8px;text-align:center">
            <div style="font-size:12px;font-weight:700;color:#9F7AEA">${w.staked}</div>
            <div style="font-size:9px;color:rgba(255,255,255,0.35);margin-top:2px">Staked</div>
          </div>
          <div style="background:rgba(255,255,255,0.05);border-radius:8px;padding:8px;text-align:center">
            <div style="font-size:12px;font-weight:700;color:#F6AD55">${w.in_projects}</div>
            <div style="font-size:9px;color:rgba(255,255,255,0.35);margin-top:2px">Projects</div>
          </div>
        </div>
      </div>
      <!-- Details -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="glass-card fade-in" style="padding:12px;animation-delay:0.06s">
          <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:4px">Yield This Month</div>
          <div style="font-size:15px;font-weight:800;color:#68D391">${data.yield_this_month}</div>
        </div>
        <div class="glass-card fade-in" style="padding:12px;animation-delay:0.09s">
          <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:4px">Network Rank</div>
          <div style="font-size:13px;font-weight:800;color:#63B3ED">${data.rank_in_network}</div>
        </div>
        <div class="glass-card fade-in" style="padding:12px;animation-delay:0.12s">
          <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:4px">Top Earning Source</div>
          <div style="font-size:11px;font-weight:700;color:#9F7AEA">${data.top_earning_source}</div>
        </div>
        <div class="glass-card fade-in" style="padding:12px;animation-delay:0.15s">
          <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-bottom:4px">Unlock ${data.upcoming_unlock.date}</div>
          <div style="font-size:14px;font-weight:800;color:#F6AD55">${data.upcoming_unlock.amount}</div>
        </div>
      </div>
    </div>`;
}
initSlide(83,renderSlide83,{jsonFile:'../en2.json',slideIndex:32});
</script></body></html>
