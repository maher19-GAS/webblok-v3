<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>2030B – CTC Economic Flow</title><link rel="stylesheet" href="../css/styles.css"></head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="slide-container"><div class="slide-bg"></div>
<div id="skeleton" class="slide-inner" style="padding-top:24px"><div style="display:flex;flex-direction:column;gap:8px"><div class="skeleton skeleton-title" style="width:55%"></div>${[1,2,3,4,5,6].map(()=>`<div class="skeleton skeleton-text" style="width:100%"></div>`).join('')}</div></div>
<div id="content" class="slide-content" style="display:none;flex-direction:column"></div><div id="footer-nav"></div></div>
<script src="../js/animations.js"></script><script src="../js/loader.js"></script><script src="../js/slide-utils.js"></script>
<script>
function renderSlide82(data,lang){
  const colors=['#63B3ED','#9F7AEA','#F6AD55','#68D391','#FC8181','#76E4F7'];
  return `
    ${buildSlideHeader(data,'💸')}
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:8px">
      ${data.flows.map((f,i)=>`
        <div class="fade-in" style="animation-delay:${i*60}ms;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:11px">
          <div style="font-size:11px;font-weight:600;color:#fff;min-width:90px">${f.from}</div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center">
            <div style="width:100%;height:2px;background:linear-gradient(90deg,${colors[i%colors.length]},transparent);border-radius:1px;position:relative">
              <div style="position:absolute;right:-4px;top:-3px;color:${colors[i%colors.length]};font-size:10px">▶</div>
            </div>
            <div style="font-size:9px;color:rgba(255,255,255,0.4);margin-top:2px;text-align:center">${f.label}</div>
          </div>
          <div style="font-size:11px;font-weight:600;color:#fff;min-width:80px;text-align:right">${f.to}</div>
          <div style="font-size:10px;font-weight:700;color:${colors[i%colors.length]};min-width:90px;text-align:right">${f.volume}</div>
        </div>`).join('')}
      <div class="glass-card fade-in" style="padding:10px;display:flex;justify-content:space-around;text-align:center">
        <div><div style="font-size:16px;font-weight:800;color:#68D391">${data.net_new_ctc_today}</div><div style="font-size:9px;color:rgba(255,255,255,0.35)">Net New CTC/day</div></div>
        <div><div style="font-size:16px;font-weight:800;color:#FC8181">${data.burn_rate}</div><div style="font-size:9px;color:rgba(255,255,255,0.35)">Burn Rate</div></div>
      </div>
    </div>`;
}
initSlide(82,renderSlide82,{jsonFile:'../en2.json',slideIndex:31});
</script></body></html>
