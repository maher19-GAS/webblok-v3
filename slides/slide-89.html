<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>2030B – Success Stories</title><link rel="stylesheet" href="../css/styles.css"></head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="slide-container"><div class="slide-bg"></div>
<div id="skeleton" class="slide-inner" style="padding-top:24px"><div style="display:flex;flex-direction:column;gap:10px"><div class="skeleton skeleton-title" style="width:55%"></div>${[1,2,3].map(()=>`<div class="skeleton skeleton-card" style="height:90px;border-radius:12px"></div>`).join('')}</div></div>
<div id="content" class="slide-content" style="display:none;flex-direction:column"></div><div id="footer-nav"></div></div>
<script src="../js/animations.js"></script><script src="../js/loader.js"></script><script src="../js/slide-utils.js"></script>
<script>
function renderSlide89(data,lang){
  return `
    ${buildSlideHeader(data,'✨')}
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
      ${data.stories.map((s,i)=>`
        <div class="glass-card fade-in" style="padding:14px;animation-delay:${i*80}ms;background:linear-gradient(135deg,rgba(99,179,237,0.05),rgba(159,122,234,0.05))">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#63B3ED,#9F7AEA);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0">${s.avatar}</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:#fff">${s.name}</div>
              <div style="font-size:10px;color:rgba(255,255,255,0.4)">📍 ${s.location}</div>
            </div>
            <div style="margin-left:auto;text-align:right">
              <div style="font-size:10px;padding:2px 8px;border-radius:5px;background:rgba(104,211,145,0.1);color:#68D391;border:1px solid rgba(104,211,145,0.2)">${s.time}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:flex-start">
            <div style="flex:1;padding:8px;background:rgba(252,129,129,0.07);border-radius:8px;border:1px solid rgba(252,129,129,0.1)">
              <div style="font-size:9px;color:#FC8181;text-transform:uppercase;margin-bottom:2px">Before</div>
              <div style="font-size:11px;color:rgba(255,255,255,0.6)">${s.before}</div>
            </div>
            <div style="font-size:14px;color:rgba(255,255,255,0.3);padding-top:10px">→</div>
            <div style="flex:1;padding:8px;background:rgba(104,211,145,0.07);border-radius:8px;border:1px solid rgba(104,211,145,0.1)">
              <div style="font-size:9px;color:#68D391;text-transform:uppercase;margin-bottom:2px">After</div>
              <div style="font-size:11px;color:rgba(255,255,255,0.75)">${s.after}</div>
            </div>
          </div>
        </div>`).join('')}
      <div class="glass-card fade-in" style="padding:12px;text-align:center">
        <div style="font-size:20px;font-weight:900;color:#63B3ED">${data.total_lives_changed}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.45);margin-top:3px">Lives Transformed</div>
      </div>
    </div>`;
}
initSlide(89,renderSlide89,{jsonFile:'../en2.json',slideIndex:38});
</script></body></html>
