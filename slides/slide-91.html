<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>2030B – Getting Started</title><link rel="stylesheet" href="../css/styles.css"></head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="slide-container"><div class="slide-bg"></div>
<div id="skeleton" class="slide-inner" style="padding-top:24px"><div style="display:flex;flex-direction:column;gap:8px"><div class="skeleton skeleton-title" style="width:55%"></div>${[1,2,3,4,5,6].map(()=>`<div class="skeleton skeleton-text" style="width:100%"></div>`).join('')}</div></div>
<div id="content" class="slide-content" style="display:none;flex-direction:column"></div><div id="footer-nav"></div></div>
<script src="../js/animations.js"></script><script src="../js/loader.js"></script><script src="../js/slide-utils.js"></script>
<script>
function renderSlide91(data,lang){
  const dayColors=['#63B3ED','#9F7AEA','#68D391','#F6AD55','#FC8181','#76E4F7'];
  return `
    ${buildSlideHeader(data,'🚀')}
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:0">
      ${data.steps.map((s,i)=>`
        <div class="fade-in" style="animation-delay:${i*70}ms;display:flex;gap:10px;padding-bottom:${i<data.steps.length-1?'12px':'0'}">
          <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:34px">
            <div style="width:30px;height:30px;border-radius:50%;background:${dayColors[i]}18;border:2px solid ${dayColors[i]};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:${dayColors[i]}">${i+1}</div>
            ${i<data.steps.length-1?`<div style="width:2px;flex:1;background:rgba(255,255,255,0.05);min-height:8px;margin-top:4px"></div>`:''}
          </div>
          <div style="padding-top:4px;flex:1">
            <div style="font-size:10px;font-weight:700;color:${dayColors[i]};margin-bottom:2px">${s.day}</div>
            <div style="font-size:12px;color:rgba(255,255,255,0.75);margin-bottom:3px">${s.action}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.45)">🏅 ${s.reward}</div>
          </div>
        </div>`).join('')}
      <div class="glass-card fade-in" style="padding:12px 14px;margin-top:10px;text-align:center;border-top:2px solid #68D391">
        <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-bottom:4px">Complete all 6 milestones</div>
        <div style="font-size:16px;font-weight:900;color:#68D391">${data.completion_bonus}</div>
        <div style="font-size:11px;color:rgba(255,255,255,0.45);margin-top:4px">Avg Day-30 earnings: ${data.avg_day30_earnings}</div>
      </div>
    </div>`;
}
initSlide(91,renderSlide91,{jsonFile:'../en2.json',slideIndex:40});
</script></body></html>
