<!--
  COMPONENT: Slide Container – Full Bleed (CRITICAL)
  Category:  layout
  Usage:     Full-viewport immersive slide wrapper with optional video/gradient BG
  Props:     data-bg-color, data-bg-gradient, data-bg-video, data-align
-->
<div class="slide-container-full" data-align="center" role="main" aria-label="Full-bleed slide container">

  <!-- Optional background layer -->
  <div class="sc-bg" aria-hidden="true">
    <div class="sc-bg__gradient"></div>
    <video class="sc-bg__video" autoplay muted loop playsinline></video>
    <div class="sc-bg__overlay"></div>
  </div>

  <!-- Noise / texture layer -->
  <div class="sc-noise" aria-hidden="true"></div>

  <!-- Safe-area content zone -->
  <div class="sc-content">
    <slot name="header"></slot>
    <slot></slot>
    <slot name="footer"></slot>
  </div>

  <!-- Progress pip row (optional) -->
  <div class="sc-pips" role="navigation" aria-label="Slide position"></div>

</div>

<style>
/* ── Slide Container Full ───────────────────────────────── */
.slide-container-full {
  position: relative;
  width: 100%;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--sc-bg, #0a0a1a);
}

/* Background layers */
.sc-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.sc-bg__gradient {
  position: absolute;
  inset: 0;
  background: var(--sc-gradient,
    radial-gradient(ellipse at 20% 30%, rgba(108,99,255,.35) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 70%, rgba(0,212,170,.20) 0%, transparent 55%)
  );
}
.sc-bg__video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .6s ease;
}
.sc-bg__video.active { opacity: var(--sc-video-opacity, .25); }
.sc-bg__overlay {
  position: absolute;
  inset: 0;
  background: var(--sc-overlay, rgba(10,10,26,.55));
}

/* Noise texture */
.sc-noise {
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: .025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events: none;
}

/* Content zone */
.sc-content {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: clamp(1.5rem, 4vw, 4rem) clamp(1rem, 5vw, 6rem);
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  gap: 1.5rem;
}

/* Alignment variants */
.slide-container-full[data-align="start"] .sc-content { justify-content: flex-start; }
.slide-container-full[data-align="end"]   .sc-content { justify-content: flex-end; }
.slide-container-full[data-align="split"] .sc-content { flex-direction: row; gap: 3rem; }

/* Pips */
.sc-pips {
  position: absolute;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  gap: .45rem;
}
.sc-pip {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,.3);
  transition: background .3s, transform .3s;
  cursor: pointer;
}
.sc-pip.active { background: var(--color-primary, #6c63ff); transform: scale(1.4); }

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 768px) {
  .slide-container-full[data-align="split"] .sc-content {
    flex-direction: column;
    gap: 1.5rem;
  }
}
</style>

<script>
(function () {
  const containers = document.querySelectorAll('.slide-container-full');
  containers.forEach(el => {
    const vid   = el.querySelector('.sc-bg__video');
    const src   = el.dataset.bgVideo;
    const color = el.dataset.bgColor;
    const grad  = el.dataset.bgGradient;

    if (color) el.style.setProperty('--sc-bg', color);
    if (grad)  el.querySelector('.sc-bg__gradient').style.background = grad;

    if (src && vid) {
      vid.src = src;
      vid.addEventListener('canplay', () => vid.classList.add('active'));
    }
  });
})();
</script>
