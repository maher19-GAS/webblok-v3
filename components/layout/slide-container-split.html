<!--
  COMPONENT: Slide Container – Split (CRITICAL)
  Category:  layout
  Usage:     Two-column split layout (text/visual, content/media)
  Props:     data-ratio (50-50|40-60|60-40|30-70), data-reverse (true/false), data-divider (true/false)
-->
<div class="slide-container-split" data-ratio="50-50" data-reverse="false" data-divider="true" role="main">

  <!-- Left pane -->
  <section class="scs-pane scs-pane--left" aria-label="Primary content">
    <div class="scs-pane__inner">
      <slot name="left"></slot>
    </div>
  </section>

  <!-- Animated divider -->
  <div class="scs-divider" aria-hidden="true">
    <span class="scs-divider__line"></span>
    <span class="scs-divider__dot"></span>
    <span class="scs-divider__line"></span>
  </div>

  <!-- Right pane -->
  <section class="scs-pane scs-pane--right" aria-label="Secondary content / visual">
    <div class="scs-pane__inner">
      <slot name="right"></slot>
    </div>
  </section>

</div>

<style>
/* ── Slide Container Split ────────────────────────────────── */
.slide-container-split {
  display: grid;
  width: 100%;
  min-height: 100dvh;
  background: var(--color-bg, #0a0a1a);
  overflow: hidden;
}

/* Ratio variants */
.slide-container-split[data-ratio="50-50"] { grid-template-columns: 1fr auto 1fr; }
.slide-container-split[data-ratio="40-60"] { grid-template-columns: 40fr auto 60fr; }
.slide-container-split[data-ratio="60-40"] { grid-template-columns: 60fr auto 40fr; }
.slide-container-split[data-ratio="30-70"] { grid-template-columns: 30fr auto 70fr; }

/* Reverse */
.slide-container-split[data-reverse="true"] { direction: rtl; }
.slide-container-split[data-reverse="true"] .scs-pane__inner { direction: ltr; }

/* Panes */
.scs-pane {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.scs-pane--left  { background: rgba(108,99,255,.05); }
.scs-pane--right { background: rgba(0,212,170,.04); }

.scs-pane__inner {
  width: 100%;
  max-width: 640px;
  padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 4vw, 3.5rem);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

/* Divider */
.scs-divider {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 2px;
  padding: 2rem 0;
  gap: .5rem;
  position: relative;
  z-index: 1;
}
.slide-container-split[data-divider="false"] .scs-divider { display: none; }

.scs-divider__line {
  flex: 1;
  width: 1px;
  background: linear-gradient(180deg, transparent, rgba(255,255,255,.15), transparent);
}
.scs-divider__dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--color-primary, #6c63ff);
  box-shadow: 0 0 12px var(--color-primary, #6c63ff);
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse {
  0%,100% { transform: scale(1); box-shadow: 0 0 12px var(--color-primary, #6c63ff); }
  50%      { transform: scale(1.5); box-shadow: 0 0 24px var(--color-primary, #6c63ff); }
}

/* ── Responsive: Stack on mobile ─── */
@media (max-width: 900px) {
  .slide-container-split,
  .slide-container-split[data-ratio] {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
  }
  .scs-divider { flex-direction: row; width: 100%; height: 2px; padding: 0 2rem; }
  .scs-divider__line { flex: 1; height: 1px; width: auto; background: linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent); }
  .scs-pane--left,
  .scs-pane--right { min-height: 50dvh; }
  .slide-container-split[data-reverse="true"] { direction: ltr; }
  .slide-container-split[data-reverse="true"] .scs-pane--left  { order: 2; }
  .slide-container-split[data-reverse="true"] .scs-divider     { order: 1; }
  .slide-container-split[data-reverse="true"] .scs-pane--right { order: 0; }
}
</style>
