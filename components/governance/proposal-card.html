<!-- COMPONENT: Proposal Card | governance/proposal-card.html -->
<!-- Props: proposal{title, votes_for, votes_against, days_left} -->
<div id="gov-proposals-list" style="display:flex;flex-direction:column;gap:10px"></div>
<script>
(function renderProposals(proposals) {
  const c = document.getElementById('gov-proposals-list');
  if (!c || !proposals) return;
  c.innerHTML = proposals.map((p, i) => {
    const total = p.votes_for + p.votes_against;
    const forPct = total ? Math.round((p.votes_for / total) * 100) : 0;
    const urgency = p.days_left <= 2 ? '#FC8181' : p.days_left <= 5 ? '#F6AD55' : '#68D391';
    return `
    <div class="proposal-card fade-in" style="animation-delay:${i*80}ms;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:14px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px">
        <div style="font-size:12px;font-weight:600;color:#fff;line-height:1.4;flex:1">${p.title}</div>
        <div style="flex-shrink:0;font-size:10px;padding:2px 8px;border-radius:5px;background:${urgency}15;color:${urgency};border:1px solid ${urgency}30;white-space:nowrap">${p.days_left}d left</div>
      </div>
      <!-- Vote bar -->
      <div style="height:5px;background:rgba(252,129,129,0.2);border-radius:3px;overflow:hidden;margin-bottom:6px">
        <div style="height:100%;width:${forPct}%;background:linear-gradient(90deg,#68D391,#63B3ED);border-radius:3px;transition:width 1s ease ${i*100}ms"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px">
        <span style="color:#68D391">✓ For: ${p.votes_for}%</span>
        <span style="color:#FC8181">✗ Against: ${p.votes_against}%</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px">
        <button style="flex:1;padding:6px;border-radius:7px;border:none;background:rgba(104,211,145,0.1);color:#68D391;font-size:11px;font-weight:600;cursor:pointer;border:1px solid rgba(104,211,145,0.2)">Vote For</button>
        <button style="flex:1;padding:6px;border-radius:7px;border:none;background:rgba(252,129,129,0.08);color:#FC8181;font-size:11px;font-weight:600;cursor:pointer;border:1px solid rgba(252,129,129,0.15)">Vote Against</button>
      </div>
    </div>`;
  }).join('');
})(window._proposalData || []);
</script>
