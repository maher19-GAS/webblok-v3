<!-- COMPONENT: Certification Card | certification/certification-card.html -->
<!-- Rendered dynamically via renderCertCard(cert, status) -->
<div id="cert-cards-container" style="display:flex;flex-direction:column;gap:12px"></div>
<script>
function renderCertCard(cert, status) {
  const actionMap = { available: 'Enroll', owned: '✓ Owned', locked: '🔒 Locked' };
  const borderMap = { available: 'rgba(99,179,237,0.2)', owned: 'rgba(104,211,145,0.25)', locked: 'rgba(255,255,255,0.07)' };
  const skills = (cert.skills || []).map(s => `<span style="font-size:10px;padding:3px 8px;background:rgba(159,122,234,0.1);border:1px solid rgba(159,122,234,0.2);border-radius:5px;color:rgba(255,255,255,0.65)">${s}</span>`).join('');
  return `
  <div class="cert-card fade-in" style="background:linear-gradient(135deg,rgba(99,179,237,0.05),rgba(159,122,234,0.05));border:1.5px solid ${borderMap[status]||borderMap.available};border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div>
        <div style="font-size:8px;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,0.35);margin-bottom:4px">CERT ${cert.id}</div>
        <div style="font-size:15px;font-weight:800;color:#fff;line-height:1.2">${cert.name}</div>
        <div style="font-size:11px;color:#63B3ED;margin-top:3px">${cert.level}</div>
      </div>
      <div style="width:44px;height:44px;border-radius:12px;background:rgba(99,179,237,0.1);border:1px solid rgba(99,179,237,0.2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">🎓</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">${skills}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)">
      <div>
        <div style="font-size:10px;color:rgba(255,255,255,0.35)">Cost</div>
        <div style="font-size:13px;font-weight:700;color:#F6AD55">${cert.ctc_cost?.toLocaleString()} CTC</div>
      </div>
      <div style="text-align:center">
        <div style="font-size:10px;color:rgba(255,255,255,0.35)">Valid</div>
        <div style="font-size:11px;font-weight:600;color:rgba(255,255,255,0.65)">${cert.validity}</div>
      </div>
      <button style="padding:7px 14px;border-radius:8px;border:none;background:${status==='owned'?'rgba(104,211,145,0.2)':status==='locked'?'rgba(255,255,255,0.05)':'linear-gradient(135deg,#63B3ED,#9F7AEA)'};color:${status==='locked'?'rgba(255,255,255,0.3)':'#fff'};font-size:11px;font-weight:700;cursor:${status==='locked'?'not-allowed':'pointer'}">${actionMap[status]||'Enroll'}</button>
    </div>
  </div>`;
}

(function initCertCards(certs) {
  const c = document.getElementById('cert-cards-container');
  if (!c || !certs) return;
  c.innerHTML = certs.map((cert, i) => renderCertCard(cert, i === 0 ? 'available' : i === 1 ? 'owned' : 'available')).join('');
})(window._certData || []);
</script>
