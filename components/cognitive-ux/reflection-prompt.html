<!-- COMPONENT: Reflection Prompt | cognitive-ux/reflection-prompt.html -->
<!-- VERY IMPORTANT – post-challenge metacognitive prompt -->
<div class="reflection-prompt" style="background:rgba(159,122,234,0.08);border:1px solid rgba(159,122,234,0.2);border-radius:16px;padding:18px">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <div style="width:36px;height:36px;border-radius:10px;background:rgba(159,122,234,0.15);display:flex;align-items:center;justify-content:center;font-size:18px">💭</div>
    <div>
      <div style="font-size:13px;font-weight:700;color:#fff">Reflection Moment</div>
      <div style="font-size:10px;color:rgba(255,255,255,0.4)">30 seconds • +10 Reputation</div>
    </div>
  </div>
  <div id="rp-question" style="font-size:13px;color:rgba(255,255,255,0.75);line-height:1.6;margin-bottom:14px">
    What strategy worked best for you during this challenge, and why?
  </div>
  <textarea id="rp-input" rows="3" placeholder="Write your reflection..." style="width:100%;box-sizing:border-box;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;color:#fff;font-size:12px;resize:none;outline:none;font-family:inherit;line-height:1.5"></textarea>
  <div style="display:flex;justify-content:flex-end;margin-top:10px;gap:8px">
    <button onclick="this.closest('.reflection-prompt').style.display='none'" style="padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:rgba(255,255,255,0.4);font-size:11px;cursor:pointer">Skip</button>
    <button onclick="submitReflection(this)" style="padding:7px 16px;border-radius:8px;border:none;background:linear-gradient(135deg,#9F7AEA,#63B3ED);color:#fff;font-size:11px;font-weight:700;cursor:pointer">Submit +10 Rep</button>
  </div>
</div>
<script>
function submitReflection(btn) {
  const input = document.getElementById('rp-input');
  if (!input?.value.trim()) { input?.focus(); return; }
  if (btn) { btn.textContent = '✓ Saved!'; btn.style.background = '#68D391'; btn.disabled = true; }
}
</script>
