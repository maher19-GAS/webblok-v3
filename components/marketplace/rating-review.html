<!-- COMPONENT: Rating & Review Block | marketplace/rating-review.html -->
<!-- Props: rating(number), review_count, reviews[] -->
<div class="rating-review-block" style="display:flex;flex-direction:column;gap:12px">
  <!-- Summary Bar -->
  <div style="display:flex;align-items:center;gap:14px">
    <div style="text-align:center">
      <div id="rr-score" style="font-size:36px;font-weight:900;color:#F6AD55">4.8</div>
      <div id="rr-stars" style="font-size:14px;color:#F6AD55">★★★★★</div>
      <div id="rr-count" style="font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px">-- reviews</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:4px">
      <div id="rr-dist"></div>
    </div>
  </div>
  <!-- Review Items -->
  <div id="rr-list" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<script>
(function renderRating(avg, count, reviews) {
  const $ = id => document.getElementById(id);
  if ($('rr-score')) $('rr-score').textContent = avg || 4.8;
  const stars = Math.round(avg || 4.8);
  if ($('rr-stars')) $('rr-stars').textContent = '★'.repeat(stars) + '☆'.repeat(5-stars);
  if ($('rr-count')) $('rr-count').textContent = (count || 0) + ' reviews';
  // Distribution bars (simplified)
  if ($('rr-dist')) {
    const dist = [45, 32, 14, 6, 3]; // 5★ to 1★
    $('rr-dist').innerHTML = [5,4,3,2,1].map((s,i) => `
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;color:rgba(255,255,255,0.4);width:12px">${s}★</span>
        <div style="flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${dist[i]}%;background:#F6AD55;border-radius:2px;transition:width 0.8s ease ${i*80}ms"></div>
        </div>
        <span style="font-size:10px;color:rgba(255,255,255,0.3);width:24px">${dist[i]}%</span>
      </div>`).join('');
  }
  if (reviews?.length && $('rr-list')) {
    $('rr-list').innerHTML = reviews.slice(0,3).map(r => `
      <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px 12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:11px;font-weight:600;color:#fff">${r.author}</span>
          <span style="font-size:12px;color:#F6AD55">${'★'.repeat(r.stars||5)}</span>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.55);line-height:1.5">${r.text}</div>
      </div>`).join('');
  }
})(window._ratingScore, window._reviewCount, window._reviewItems);
</script>
