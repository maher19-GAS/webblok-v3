<!-- components/cards/stat-card.html -->
<div class="stat-card fade-in">
  <div class="stat-icon">{{icon}}</div>
  <div class="stat-label">{{label}}</div>
  <div class="stat-value text-mono">{{value}}</div>
  <div class="stat-trend {{trendClass}}">
    <span>{{trendIcon}}</span>
    <span>{{trend}}</span>
  </div>
</div>
