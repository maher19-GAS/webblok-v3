<!-- COMPONENT: Milestone Badge | progression/milestone-badge.html -->
<!-- Props: achievements[], to be rendered dynamically -->
<div id="milestone-badges-container" style="display:flex;flex-direction:column;gap:8px"></div>
<script>
(function renderMilestoneBadges(achievements) {
  const c = document.getElementById('milestone-badges-container');
  if (!c || !achievements) return;
  const typeStyles = {
    earned: { bg: 'rgba(104,211,145,0.08)', border: 'rgba(104,211,145,0.2)', titleColor: '#68D391' },
    active: { bg: 'rgba(99,179,237,0.08)',  border: 'rgba(99,179,237,0.2)',  titleColor: '#63B3ED' },
    locked: { bg: 'rgba(255,255,255,0.03)', border: 'rgba(255,255,255,0.07)', titleColor: 'rgba(255,255,255,0.3)' }
  };
  c.innerHTML = achievements.map((a, i) => {
    const s = typeStyles[a.type || 'earned'] || typeStyles.earned;
    return `
    <div class="milestone-badge fade-in" style="animation-delay:${i*80}ms;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:${s.bg};border:1px solid ${s.border};position:relative;overflow:hidden">
      <div style="width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0">
        ${a.type === 'locked' ? '<span style="opacity:0.3">🔒</span>' : (a.icon || '🏅')}
      </div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:700;color:${s.titleColor}">${a.title || a.name}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-top:1px">${a.date || ''}</div>
      </div>
      ${a.type === 'earned' ? `<div style="background:#68D391;border-radius:6px;padding:2px 7px;font-size:9px;font-weight:700;color:#0D1A0D">✓</div>` : ''}
    </div>`;
  }).join('');
})(window._milestoneAchievements || []);
</script>
