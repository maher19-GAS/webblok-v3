<!--

  2030B Design System · Vol 2
-->
<div class="streak-tracker fade-in" id="streak-tracker">

  <div class="st-header">

      <span class="st-streak-unit">day streak</span>

    <div class="st-longest">Best: <strong>{{longest_streak}}</strong> days</div>
  </div>

  <!-- 7-day weekly view -->
  <div class="st-week-row" id="st-week">
    <!-- Days rendered by JS -->
  </div>

  <!-- Milestone track -->
  <div class="st-milestones" id="st-milestones">
    <div class="st-milestone-label">Streak Milestones</div>
    <div class="st-milestone-list" id="st-milestone-list">
      <!-- rendered by JS -->
    </div>
  </div>

  <!-- Next milestone -->
  <div class="st-next-milestone">
    <span>🎯 Next milestone:</span>
    <span class="st-next-name">{{next_milestone_name}}</span>
    <span class="st-next-days">{{days_to_next}} days away</span>
  </div>

</div>
