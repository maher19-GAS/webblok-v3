<!-- COMPONENT: AI Assistant Panel | system/ai-assistant.html -->
<!-- Personalized hints and recommendations sidebar panel -->
<div id="ai-assistant-panel" style="
  position:fixed;right:-320px;top:56px;bottom:0;width:300px;
  background:#0F1623;border-left:1px solid rgba(255,255,255,0.07);
  display:flex;flex-direction:column;gap:0;
  transition:right 0.35s cubic-bezier(.4,0,.2,1);z-index:500;
">
  <!-- Header -->
  <div style="padding:16px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#63B3ED,#9F7AEA);display:flex;align-items:center;justify-content:center;font-size:15px">🤖</div>
      <div>
        <div style="font-size:13px;font-weight:700;color:#fff">AI Advisor</div>
        <div style="font-size:10px;color:#68D391">● Online</div>
      </div>
    </div>
    <button onclick="window.AIAssistant.close()" style="background:none;border:none;color:rgba(255,255,255,0.4);font-size:18px;cursor:pointer;padding:4px">×</button>
  </div>

  <!-- Chat Area -->
  <div id="ai-chat-area" style="flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px"></div>

  <!-- Input -->
  <div style="padding:12px;border-top:1px solid rgba(255,255,255,0.06);display:flex;gap:8px">
    <input id="ai-input" placeholder="Ask your AI advisor..." style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px;color:#fff;font-size:12px;outline:none" />
    <button onclick="window.AIAssistant.send()" style="width:36px;height:36px;border-radius:8px;border:none;background:linear-gradient(135deg,#63B3ED,#9F7AEA);color:#fff;cursor:pointer;font-size:16px">↑</button>
  </div>
</div>

<!-- Toggle Button -->
<button id="ai-toggle-btn" onclick="window.AIAssistant.toggle()" style="
  position:fixed;right:16px;bottom:96px;
  width:48px;height:48px;border-radius:50%;border:none;
  background:linear-gradient(135deg,#63B3ED,#9F7AEA);
  color:#fff;font-size:20px;cursor:pointer;z-index:501;
  box-shadow:0 4px 16px rgba(99,179,237,0.3);
  transition:transform 0.2s;
">🤖</button>

<script>
window.AIAssistant = (function() {
  let _open = false;
  const panel = () => document.getElementById('ai-assistant-panel');
  const chat  = () => document.getElementById('ai-chat-area');
  const input = () => document.getElementById('ai-input');

  const hints = [
    "Based on your profile, focus on Systems Thinking to unlock Level 9.",
    "Your Pattern Recognition is strong! Try the Grand Tournament this weekend.",
    "You've been on a 14-day streak — amazing consistency! Keep it going.",
    "Consider locking 5,000 CTC for 90 days to gain +25% yield multiplier.",
    "The Quantum Climate Model project is a 95% match for your skill set."
  ];

  function addMessage(text, isUser) {
    const el = document.createElement('div');
    el.style.cssText = `max-width:85%;padding:9px 12px;border-radius:${isUser?'12px 12px 4px 12px':'12px 12px 12px 4px'};background:${isUser?'linear-gradient(135deg,#63B3ED,#9F7AEA)':'rgba(255,255,255,0.05)'};color:#fff;font-size:12px;line-height:1.5;align-self:${isUser?'flex-end':'flex-start'}`;
    el.textContent = text;
    chat().appendChild(el);
    chat().scrollTop = chat().scrollHeight;
  }

  function open() {
    _open = true;
    panel().style.right = '0';
    if (!chat().children.length) addMessage(hints[Math.floor(Math.random()*hints.length)], false);
  }

  function close() { _open = false; panel().style.right = '-320px'; }
  function toggle() { _open ? close() : open(); }

  function send() {
    const val = input()?.value?.trim();
    if (!val) return;
    addMessage(val, true);
    input().value = '';
    setTimeout(() => addMessage(hints[Math.floor(Math.random()*hints.length)], false), 800);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const inp = input();
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  });

  return { open, close, toggle, send };
})();
</script>
