<!-- components/advanced/resource-meter.html -->
<div class="resource-meter fade-in">
  <div class="resource-header">
    <span class="resource-label">{{label}}</span>
    <span class="resource-value">{{value}}</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill {{fillClass}}" data-progress="{{percent}}" style="width:0%"></div>
  </div>
  <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:4px">{{description}}</div>
</div>
