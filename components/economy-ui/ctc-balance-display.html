<!--
  CTCBalanceDisplay — Always-visible CTC wallet overview
  2030B Design System · Vol 2
  Shows: Available, Locked, Lifetime earned
-->
<div class="ctc-balance-display fade-in" id="ctc-balance-display">

  <!-- Main balance -->
  <div class="cbd-main">
    <div class="cbd-main-label">Total Balance</div>
    <div class="cbd-main-amount">
      <span class="cbd-amount" id="cbd-total">{{total_balance}}</span>
      <span class="cbd-unit">CTC</span>
    </div>
    <div class="cbd-rank">Rank: <strong id="cbd-rank">{{rank}}</strong> of {{total_users}}</div>
  </div>

  <!-- Balance breakdown -->
  <div class="cbd-breakdown" id="cbd-breakdown">
    <div class="cbd-item liquid">
      <div class="cbd-item-icon">💧</div>
      <div class="cbd-item-info">
        <div class="cbd-item-label">Available</div>
        <div class="cbd-item-value" id="cbd-liquid">{{liquid}}</div>
      </div>
    </div>
    <div class="cbd-divider"></div>
    <div class="cbd-item staked">
      <div class="cbd-item-icon">💎</div>
      <div class="cbd-item-info">
        <div class="cbd-item-label">Locked</div>
        <div class="cbd-item-value" id="cbd-staked">{{staked}}</div>
      </div>
    </div>
    <div class="cbd-divider"></div>
    <div class="cbd-item lifetime">
      <div class="cbd-item-icon">⭐</div>
      <div class="cbd-item-info">
        <div class="cbd-item-label">Lifetime</div>
        <div class="cbd-item-value" id="cbd-lifetime">{{lifetime}}</div>
      </div>
    </div>
  </div>

  <!-- This month summary -->
  <div class="cbd-month-summary">
    <div class="cbd-month-item">
      <span class="cbd-month-label">Earned this month</span>
      <span class="cbd-month-val green" id="cbd-earned">+{{earned_month}}</span>
    </div>
    <div class="cbd-month-item">
      <span class="cbd-month-label">Spent this month</span>
      <span class="cbd-month-val red" id="cbd-spent">−{{spent_month}}</span>
    </div>
  </div>

  <!-- Quick actions -->
  <div class="cbd-actions">
    <button class="cbd-action-btn" onclick="CTCEngine.openLock()">💎 Lock CTC</button>
    <button class="cbd-action-btn" onclick="CTCEngine.openSend()">↗ Send</button>
    <button class="cbd-action-btn" onclick="CTCEngine.openHistory()">📋 History</button>
  </div>

</div>
